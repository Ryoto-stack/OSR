const esc2 = esc;

/* ---------- shell pieces ---------- */
function renderTopbar() {
  const s = Store.s;
  return `
  <header class="topbar">
    <button class="btn icon ghost menu-btn" data-act="toggle-rail" aria-label="Menu">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M4 7.5h16M4 12.5h11M4 17.5h7"/></svg>
      </div>
      <div>
        <div class="brand-name">OSR Desk</div>
      </div>
      <span class="brand-sub">· your own support kit</span>
    </div>
    <div class="topbar-spacer"></div>
    <div class="search-wrap">
      ${ICON.search}
      <input id="global-search" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search templates, phrases, files, cases…" value="${esc(view.q)}" aria-label="Search everything">
      <span class="kbd-hint"><kbd id="mod-key">Ctrl</kbd><kbd>K</kbd></span>
    </div>
    <button class="btn" data-act="palette">${ICON.bolt}<span>Palette</span></button>
    <button class="btn primary" data-act="new-template">${ICON.plus}<span>New template</span></button>
    <button class="btn icon ghost" data-act="toggle-railhide" title="Hide this sidebar (Ctrl+B)" aria-label="Hide sidebar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg>
    </button>
    <button class="btn icon ghost" data-act="settings" title="Settings & backup" aria-label="Settings">${ICON.gear}</button>
  </header>`;
}

function railItem(act, label, opts = {}) {
  const cnt = opts.count != null ? `<span class="count">${opts.count}</span>` : '';
  const dot = opts.color ? `<span class="dot" style="background:${opts.color}"></span>` : (opts.icon || '');
  return `<button class="rail-item ${opts.active ? 'active' : ''}" data-act="${act}" ${opts.data || ''}
            title="${esc2(opts.title || label)}">${dot}<span class="label">${esc2(label)}</span>${cnt}</button>`;
}

function renderRail() {
  const s = Store.s;
  const cats = [...s.categories].sort((a, b) => a.order - b.order);
  const favCount = s.templates.filter((t) => t.favorite).length;
  const tabs = [
    ['library', 'Templates', ICON.lib],
    ['files', 'Resource shelf', ICON.shelf],
    ['cases', 'Live cases', ICON.cases]
  ];
  return `
  <nav class="rail" aria-label="Sections">
    <div>
      <div class="rail-sec-title">Workspace</div>
      <div class="rail-list">
        ${tabs.map(([tab, name, ic]) =>
          railItem('tab:' + tab, name, { active: view.tab === tab, icon: `<span style="color:var(--ink-3);display:flex">${ic}</span>` })).join('')}
      </div>
    </div>

    <div>
      <div class="rail-sec-title">Library</div>
      <div class="rail-list">
        ${railItem('cat:all', 'All templates', { active: view.tab === 'library' && view.cat === 'all', count: s.templates.length })}
        ${railItem('cat:fav', 'Starred', { active: view.cat === 'fav', count: favCount })}
        ${railItem('cat:used', 'Recently used', { active: view.cat === 'used', count: s.templates.filter((t) => t.usage > 0).length })}
        ${railItem('cat:orphan', 'No category', { active: view.cat === 'orphan', count: s.templates.filter((t) => !cats.some((c) => c.id === t.category)).length })}
      </div>
    </div>

    <div>
      <div class="rail-sec-title">Categories <button class="btn ghost sm" data-act="add-cat" title="New category">${ICON.plus}</button></div>
      <div class="rail-list">
        ${cats.map((c) => {
          const n = s.templates.filter((t) => t.category === c.id).length;
          return railItem('cat:' + c.id, c.name, {
            active: view.cat === c.id, count: n, color: c.color || 'var(--ink-3)', title: c.desc || c.name
          });
        }).join('') || `<div class="rail-empty">No categories yet.</div>`}
      </div>
    </div>

    <div>
      <div class="rail-sec-title">Quick add</div>
      <div class="rail-list">
        ${railItem('new-template', 'New template', { icon: `<span style="color:var(--ink-3);display:flex">${ICON.plus}</span>` })}
        ${railItem('new-phrase', 'New phrase / line', { icon: `<span style="color:var(--ink-3);display:flex">${ICON.quote}</span>` })}
        ${railItem('drop-files', 'Drop / add files', { icon: `<span style="color:var(--ink-3);display:flex">${ICON.file}</span>`, count: s.files.length })}
        ${railItem('new-case', 'New case', { icon: `<span style="color:var(--ink-3);display:flex">${ICON.cases}</span>`, count: s.cases.filter((c) => c.status !== 'resolved').length })}
      </div>
    </div>

    <div class="rail-foot">
      ${s.settings.yourName ? `<div class="rail-sec-title" style="padding-bottom:2px">Signed in as</div>
        <div class="rail-item" data-act="settings" title="Edit your signature & details">
          <span class="dot" style="background:var(--ok)"></span>
          <span class="label">${esc2(s.settings.yourName)}${s.settings.company ? ' · ' + esc2(s.settings.company) : ''}</span>
        </div>` : `<button class="rail-item" data-act="settings"><span class="dot" style="background:var(--warn)"></span><span class="label">Add your name &amp; signature</span></button>`}
      <div class="save-state ${Store.isDirty ? 'dirty' : ''}" id="save-state" title="${Store.mode === 'idb' ? 'IndexedDB · ' + DB.name : 'local storage'}"><i></i><span>${Store.isDirty ? 'Saving…' : (Store.mode === 'idb' ? 'Saved to the local database' : (KV.available ? 'Saved on this PC' : 'Not persisting!'))}</span></div>
    </div>
  </nav>`;
}

/* ---------- library ---------- */
function templateCard(t, q) {
  const cat = Q.category(t.category);
  const v = varsIn(t.body);
  const files = (t.fileIds || []).length;
  const preview = String(t.body).replace(/\{\{\s*([^}]+?)\s*\}\}/g, '[$1]');
  return `
  <article class="card ${view.selected === t.id ? 'selected' : ''}" data-act="select" data-id="${t.id}" tabindex="0"
           role="button" aria-label="Template ${esc2(t.title)}">
    <div class="card-top">
      <h3 class="card-title">${hl(t.title, q)}</h3>
      <span class="card-cat">${cat ? `<span class="dot" style="width:6px;height:6px;border-radius:9px;background:${cat.color || 'var(--ink-3)'};display:inline-block"></span>${esc2(cat.name)}` : 'Unsorted'}</span>
      <button class="star ${t.favorite ? 'on' : ''}" data-act="star" data-id="${t.id}" title="${t.favorite ? 'Unstar' : 'Star this'}" aria-label="Star">${ICON.star}</button>
    </div>
    ${t.subject ? `<div class="card-subj">${hl(t.subject, q)}</div>` : ''}
    <div class="card-snip">${hl(preview.slice(0, 320), q)}</div>
    <div class="card-foot">
      <div class="card-meta">
        ${v.length ? `<span class="varpill" title="Placeholders you'll be prompted to fill">${v.length} field${v.length > 1 ? 's' : ''}</span>` : ''}
        ${files ? `<span class="filepill">${ICON.file}${files}</span>` : ''}
        ${(t.tags || []).slice(0, 2).map((tag) => `<span class="tag" data-act="tag" data-tag="${esc2(tag)}" title="Filter by #${esc2(tag)}">#${esc2(tag)}</span>`).join('')}
        ${t.usage ? `<span title="Copied ${t.usage}×">×${t.usage}</span>` : ''}
      </div>
      <div class="card-btns">
        <button class="btn sm" data-act="edit" data-id="${t.id}" title="Edit (E)">${ICON.edit}<span>Edit</span></button>
        <button class="btn sm copy-btn" data-act="copy" data-id="${t.id}" title="Copy to clipboard (C)">${ICON.copy}<span>Copy</span></button>
      </div>
    </div>
  </article>`;
}

function phraseRow(p, q) {
  return `<div class="phrase" data-act="copy-phrase" data-id="${p.id}" tabindex="0" title="Click to copy · right-click / long-press for options">
    <p>${hl(p.text, q)}</p>
    <span class="copy-inline btn sm" style="pointer-events:none">${ICON.copy}</span>
  </div>`;
}

function recentCopiedStrip() {
  const items = (Store.s.activity || []).filter((a) => a.kind === 'copy').slice(0, 6);
  if (items.length < 2) return '';
  return `<div class="tagchips" style="margin:-4px 0 12px;align-items:center">
    <span style="font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--ink-3)">Just copied</span>
    ${items.map((a) => {
      const t = Q.template(a.ref) || Q.phrase?.(a.ref);
      const label = a.title || t?.title || (a.ref || '').toString();
      return `<button class="chip" data-act="recopy" data-kind="${a.refKind || 'tpl'}" data-id="${a.ref}" title="Copy again">${ICON.copy} ${esc2(label.length > 34 ? label.slice(0, 34) + '…' : label)}</button>`;
    }).join('')}
  </div>`;
}

function renderLibrary(list, filtered) {
  const s = Store.s;
  const cat = Q.category(view.cat);
  const titles = {
    all: 'All templates', fav: 'Starred', used: 'Recently used', orphan: 'No category'
  };
  const title = cat ? cat.name : titles[view.cat] || 'All templates';
  const desc = cat?.desc || (view.cat === 'fav' ? 'The ones you reach for. Anything can be starred from its card.'
    : view.cat === 'used' ? 'Sorted by how often you actually copy each one.'
    : titles[view.cat] ? 'Everything you keep. Click a card to open it, C to copy it, E to change it.' : '');
  const tags = Q.allTags().slice(0, 14);
  const phrases = s.phrases || [];

  return `
  <div class="main-head">
    <div>
      <div class="main-title">${esc2(title)}</div>
      <div class="main-desc">${esc2(desc || '')}</div>
    </div>
    <div class="main-actions">
      ${cat ? `<button class="btn sm ghost" data-act="edit-cat" data-id="${cat.id}" title="Rename / recolor">${ICON.edit}</button>
               <button class="btn sm ghost" data-act="del-cat" data-id="${cat.id}" title="Delete category (templates move to No category)">${ICON.trash}</button>` : ''}
      <button class="btn sm" data-act="new-phrase">${ICON.quote}<span>Add phrase</span></button>
      <button class="btn sm" data-act="print">${ICON.download}<span>Print sheet</span></button>
      <button class="btn sm" data-act="new-template">${ICON.plus}<span>Template</span></button>
    </div>
  </div>

  <div class="toolbar">
    <div class="field-inline">
      <select class="mini" data-act="set-sort" aria-label="Sort">
        ${[['manual', 'My order'], ['recent', 'Last used first'], ['az', 'A → Z'], ['used', 'Most used'], ['new', 'Last edited'], ['cat', 'By category']]
          .map(([v, l]) => `<option value="${v}" ${s.settings.sort === v ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
    </div>
    <div class="field-inline">
      <select class="mini" data-act="set-view" aria-label="Layout">
        <option value="grid" ${s.settings.view === 'grid' ? 'selected' : ''}>Cards</option>
        <option value="list" ${s.settings.view === 'list' ? 'selected' : ''}>List</option>
      </select>
    </div>
    <div class="sep"></div>
    <div class="tagchips">
      ${tags.map(([tag, n]) => `<button class="chip ${view.tags.includes(tag) ? 'on' : ''}" data-act="tag" data-tag="${esc2(tag)}">#${esc2(tag)} <span style="opacity:.65">${n}</span></button>`).join('')}
      ${view.tags.length ? `<button class="chip" data-act="clear-tags" style="color:var(--bad)">clear ${view.tags.length}</button>` : ''}
    </div>
    <div class="grow"></div>
    <span style="font-size:11.5px;color:var(--ink-3)">${list.length} shown</span>
  </div>

  ${recentCopiedStrip()}
  ${renderChecklist()}

  ${list.length === 0 ? emptyLibrary(filtered) : `
    <div class="${s.settings.view === 'list' ? 'list' : 'grid'}">
      ${list.map((t) => templateCard(t, view.q)).join('')}
    </div>`}

  ${view.cat === 'all' && !filtered && phrases.length ? `
    <div class="pane-sec" style="margin-top:26px">
      <h4>${ICON.quote} Grab-and-go lines <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-3)">— single sentences, click to copy</span>
        <button class="btn ghost sm" data-act="new-phrase" style="margin-left:auto">${ICON.plus} Add</button>
      </h4>
      <div class="phrase-grid">${phrases.map((p) => phraseRow(p, view.q)).join('')}</div>
    </div>` : ''}
  `;
}

function emptyLibrary(filtered) {
  if (filtered) {
    return `<div class="empty">
      <h3>Nothing matches “${esc2(view.q)}”${view.tags.length ? ' + #' + esc2(view.tags.join(', #')) : ''}</h3>
      <p>Search looks at titles, the email body, tags and categories. Try fewer words, or make this a new template — one you wrote beats one you can't find.</p>
      <div class="row">
        <button class="btn" data-act="clear-search">Clear search</button>
        <button class="btn primary" data-act="new-template">${ICON.plus} New template from scratch</button>
      </div>
    </div>`;
  }
  return `<div class="empty">
    <h3>Nothing here yet</h3>
    <p>Save the emails you send every day. Open one of your sent messages, copy the body, hit <b>New template</b>, and swap the client-specific bits for placeholders like <code style="font-family:var(--mono)">{{first_name}}</code>.</p>
    <div class="row">
      <button class="btn primary" data-act="new-template">${ICON.plus} New template</button>
      <button class="btn" data-act="import">Import a backup</button>
    </div>
  </div>`;
}

const SETUP = [
  { key: 'me', label: 'Put your name + signature on file', hint: 'so {{agent_name}} fills itself in', act: 'settings', icon: ICON.gear },
  { key: 'own', label: 'Write 5 of your own templates', hint: 'the ones only your team sends', act: 'new-template', icon: ICON.plus },
  { key: 'star', label: 'Star the 3 you use most', hint: 'they jump to the Starred view', act: 'cat:fav', icon: ICON.star },
  { key: 'files', label: 'Drop the docs you keep re-opening', hint: 'SOPs, price list, escalation contacts', act: 'tab:files', icon: ICON.file },
  { key: 'cases', label: 'Put today\u2019s open threads on the board', hint: 'who owes you a reply', act: 'tab:cases', icon: ICON.cases }
];

function renderChecklist() {
  const st = Store.s;
  if (st.settings.hideChecklist) return '';
  const done = {
    me: !!(st.settings.yourName && (st.settings.signature || st.settings.company)),
    own: st.templates.filter((t) => t.custom).length >= 5,
    star: st.templates.filter((t) => t.favorite).length >= 3,
    files: st.files.length > 0,
    cases: st.cases.length > 0
  };
  const n = Object.values(done).filter(Boolean).length;
  if (n === 5) return `<div class="checklist done-strip"><b>${ICON.check} Your desk is set up.</b>
    <span>Five habits in there will save you an hour a day: search before you type, keep placeholders short, star the winners, prune what you never copy, and export weekly.</span>
    <button class="btn sm ghost" data-act="hide-checklist">hide this</button></div>`;
  return `<div class="checklist">
    <div class="cl-head"><b>First week</b><span>${n} of 5 done</span>
      <div class="cl-bar"><i style="width:${(n / 5) * 100}%"></i></div>
      <button class="btn sm ghost" data-act="hide-checklist" title="Not now">hide</button></div>
    <div class="cl-items">
      ${SETUP.map((item) => `<button class="cl-item ${done[item.key] ? 'on' : ''}" data-act="${item.act}" title="${esc2(item.hint)}">
        <span class="tick">${done[item.key] ? ICON.check : ''}</span>
        <span class="ci-label">${esc2(item.label)}</span><span class="ci-hint">${esc2(item.hint)}</span></button>`).join('')}
    </div>
  </div>`;
}

/* ---------- files ---------- */
function fileCard(f, opts = {}) {
  const isImg = /^image\//.test(f.mime || '');
  const link = f.kind === 'link';
  return `
  <article class="file-card ${opts.dragging ? 'dragging' : ''}" data-file="${f.id}" draggable="true" data-act="${opts.attach ? 'noop' : 'open-file'}" data-id="${f.id}">
    <div class="file-thumb">
      ${link ? `<div style="font-size:11.5px;padding:0 10px;text-align:center;color:var(--accent);word-break:break-all">${esc2(String(f.url || '').replace(/^https?:\/\//, '').slice(0, 60))}</div>`
        : isImg && f.thumb ? `<img src="${esc2(f.thumb)}" alt="${esc2(f.name)}">`
        : `<span class="ext">${esc2((link ? 'link' : (f.name.split('.').pop() || 'file')).slice(0, 4))}</span>`}
    </div>
    <div class="file-name">${esc2(f.name)}</div>
    <div class="file-sub">
      ${link ? 'Saved link' : bytes(f.size)}
      ${f.note ? ' · ' + esc2(f.note) : ''}
      ${opts.showUsage ? `<span style="margin-left:auto">${(Store.s.templates || []).filter((t) => (t.fileIds || []).includes(f.id)).length} tpl</span>` : ''}
    </div>
    <div class="file-btns">
      ${opts.tpl ? `<button class="btn sm danger" data-act="detach" data-id="${f.id}" data-tpl="${opts.tpl}" title="Remove from this template">${ICON.close}</button>` : ''}
      ${link ? '' : `<button class="btn sm" data-act="download-file" data-id="${f.id}">${ICON.download}</button>`}
      <button class="btn sm" data-act="use-file" data-id="${f.id}" title="Attach to a template or case">${ICON.attach}</button>
      <button class="btn sm" data-act="rename-file" data-id="${f.id}" title="Rename / add note">${ICON.edit}</button>

          </td>

            <select class="mini status-pill" data-status="${c.status}" data-act="case-status" data-id="${c.id}" style="max-width:150px;font-weight:600">

/* ---------- preview pane ---------- */
function renderPane(t) {
  if (!t) return '';
  const cat = Q.category(t.category);
  const v = varsIn(t.body);
  const files = Q.filesFor(t);
  const filled = fillVars(t.body).text;
  return `
  <div class="pane-head">
    <span class="card-cat" style="flex:none">${cat ? `<span class="dot" style="width:6px;height:6px;border-radius:9px;background:${cat.color};display:inline-block"></span>${esc2(cat.name)}` : 'Unsorted'}</span>
    <div class="t" title="${esc2(t.title)}">${esc2(t.title)}</div>
    <button class="btn icon sm ghost" data-act="star" data-id="${t.id}" title="Star">${ICON.star}</button>
    <button class="btn icon sm ghost" data-act="close-pane" title="Close (Esc)" aria-label="Close">${ICON.close}</button>
  </div>
  <div class="pane-body">
    ${t.useWhen ? `<div class="pane-sec"><h4>When I use this</h4><div class="help" style="font-size:12.5px;color:var(--ink-2);line-height:1.6">${hl(t.useWhen, '')}</div></div>` : ''}
    <div class="pane-sec subj-row">
      <h4>Subject line <button class="btn ghost sm" data-act="copy-subject" data-id="${t.id}" style="margin-left:auto">${ICON.copy} ${t.subject ? 'Copy subject' : 'Add one'}</button></h4>
      ${t.subject ? `<div class="subj">${renderProse(fillVars(t.subject).text)}</div>` : `<div class="help">No subject on this template yet — click “Add one” to write it (useful when you start a new thread instead of replying).</div>`}
    </div>
    <div class="pane-sec">
      <h4>${ICON.copy} Email body <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-3)">· ${t.body.length.toLocaleString()} chars</span></h4>
      <div class="prose" id="pane-prose" style="font-size:${Store.s.settings.fontSize}px">${renderProse(t.body)}</div>
    </div>
    <div class="pane-sec">
      <h4>${ICON.bolt} Filled preview</h4>
      <div class="prose" style="font-size:${Store.s.settings.fontSize}px;max-height:300px;overflow:auto">${renderProse(filled, true)}</div>
    </div>
    ${v.length ? `<div class="pane-sec"><h4>Fields it fills in</h4><div class="var-list">${v.map((k) => `<button class="chip" data-act="fill-var" data-key="${esc2(k)}" title="Update the value used for {{${esc2(k)}}}">{{${esc2(k)}}}</button>`).join('')}</div></div>` : ''}
    ${(t.tags || []).length ? `<div class="pane-sec"><h4>Tags</h4><div class="tagchips">${t.tags.map((tag) => `<button class="chip" data-act="tag" data-tag="${esc2(tag)}">#${esc2(tag)}</button>`).join('')}</div></div>` : ''}
    <div class="pane-sec">
      <h4>${ICON.file} Attachments <button class="btn ghost sm" data-act="attach-to" data-id="${t.id}" style="margin-left:auto">${ICON.plus} add</button></h4>
      ${files.length ? `<div class="files-grid">${files.map((f) => fileCard(f)).join('')}</div>` : `<div class="help">Nothing attached. You can drag a file straight onto this template's card — handy for “here's the form / screenshot / guide I always send”.</div>`}
    </div>
    <div class="meta-row">
      <span title="Copied ${t.usage} times">used ${t.usage || 0}×</span><span>·</span>
      <span>${t.lastUsed ? 'last copied ' + ago(t.lastUsed) : 'never copied'}</span><span>·</span>
      <span>edited ${ago(t.updatedAt)}</span>
    </div>
  </div>
  <div class="pane-foot">
    <button class="btn primary copy-btn" data-act="copy" data-id="${t.id}">${ICON.copy}<span>Copy</span></button>
    <button class="btn" data-act="fill-copy" data-id="${t.id}">${ICON.bolt}<span>Fill &amp; copy</span></button>
    <button class="btn" data-act="edit" data-id="${t.id}">${ICON.edit}<span>Edit</span></button>
    <span class="hint"><kbd>C</kbd> copy · <kbd>E</kbd> edit</span>
  </div>`;
}

function usagePanel() {
  const list = Store.s.templates.filter((t) => t.usage > 0).sort((a, b) => b.usage - a.usage).slice(0, 6);
  const never = Store.s.templates.filter((t) => !t.usage).length;
  const week = Store.s.templates.filter((t) => t.lastUsed && Date.now() - new Date(t.lastUsed) < 7 * 864e5).length;
  return `
  ${list.length ? `<div class="usage-list">${list.map((t) => {
    const max = list[0].usage || 1;
    return `<button class="usage-row" data-act="select" data-id="${t.id}" title="Open ${esc2(t.title)}">
      <span class="u-name">${esc2(t.title)}</span>
      <span class="u-bar"><i style="width:${Math.max(6, (t.usage / max) * 100)}%"></i></span>
      <span class="u-n">${t.usage}×</span><span class="u-ago">${ago(t.lastUsed)}</span></button>`;
  }).join('')}</div>` : '<div class="help">Nothing copied yet — this fills in as you use the desk.</div>'}
  <div class="meta-row"><span>${Store.s.templates.length} templates</span><span>·</span><span>${never} never copied</span><span>·</span><span>${week} used this week</span></div>`;
}

function renderProse(text, plain) {
  let out = esc(text);
  out = out.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (m, k) => `<span class="var">{{${esc(k.trim())}}}</span>`);
  if (plain) out = out.replace(/&lt;(b|i|u)&gt;|&lt;\/(b|i|u)&gt;/g, '');
  return out;
}

<script data-src="src/js/app.js">
/* =========================================================
   app.js — view state, render loop, copy engine, editor,
   modals, toasts, keyboard. (panels.js adds files/cases/etc)
   ========================================================= */

const view = {
  tab: 'library',          // library | files | cases | settings
  cat: 'all',              // all | fav | used | orphan | <category id>
  q: '',
  tags: [],
  fileQ: '',
  selected: null,
  pane: false,
  dropHot: false,
  railOpen: false
};

/* ---------- toast ---------- */
const Bus = {
  toast(msg, kind = '', ms = 2600, action) {
    const host = document.getElementById('toasts');
    if (!host) return;
    const el = document.createElement('div');
    el.className = 'toast ' + kind;
    el.innerHTML = `<div class="msg">${esc(msg)}</div>` +
      (action ? `<button class="undo">${esc(action.label)}</button>` : '');
    if (action) el.querySelector('.undo').onclick = () => { remove(); action.fn(); };
    host.appendChild(el);
    const timer = setTimeout(remove, ms);
    el.addEventListener('click', (e) => { if (e.target === el) { clearTimeout(timer); remove(); } });
    function remove() {
      clearTimeout(timer);
      el.style.transition = 'opacity .16s, transform .16s';
      el.style.opacity = '0'; el.style.transform = 'translateY(4px)';
      setTimeout(() => el.remove(), 170);
    }
    return remove;
  },
  confirm(title, body, okLabel = 'Do it', danger = true) {
    return new Promise((res) => {
      const m = openModal(`
        <div class="modal-head"><h3>${esc(title)}</h3><button class="btn icon ghost" data-close>${ICON.close}</button></div>
        <div class="modal-body"><div class="help" style="font-size:13px;line-height:1.6">${body}</div></div>
        <div class="modal-foot"><span class="grow"></span><button class="btn" data-no>Cancel</button>
        <button class="btn ${danger ? 'danger' : 'primary'}" data-yes>${esc(okLabel)}</button></div>`, { narrow: true });
      m.el.querySelector('[data-yes]').onclick = () => { m.__answered = true; m.close(); res(true); };
      m.el.querySelector('[data-no]').onclick = () => { m.__answered = true; m.close(); res(false); };
      m.onclose = () => { if (!m.__answered) res(false); };
    });
  }
};

/* ---------- modal host ---------- */
let modalStack = [];
function openModal(html, opts = {}) {
  if (opts.key) {
    const existing = modalStack.find((m) => m.key === opts.key);
    if (existing) { existing.bringUp(); return existing; }
  }
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.setAttribute('role', 'dialog');
  scrim.setAttribute('aria-modal', 'true');
  scrim.innerHTML = `<div class="modal ${opts.cls || ''} ${opts.narrow ? 'narrow' : ''} ${opts.wide ? 'wide' : ''}">${html}</div>`;
  document.body.appendChild(scrim);
  document.body.style.overflow = 'hidden';
  const el = scrim.querySelector('.modal');
  const api = {
    scrim, el, key: opts.key || null,
    bringUp() { document.body.appendChild(scrim); const f = scrim.querySelector('input,textarea'); if (f) setTimeout(() => f.focus(), 10); },
    close() {
      if (api.__closed) return;
      api.__closed = true;
      scrim.remove();
      modalStack = modalStack.filter((m) => m !== api);
      if (!modalStack.length) document.body.style.overflow = '';
      if (api.onclose) api.onclose();
    }
  };
  modalStack.push(api);
  scrim.addEventListener('mousedown', (e) => { if (e.target === scrim) api.close(); });
  el.querySelectorAll('[data-close]').forEach((b) => (b.onclick = () => api.close()));
  const first = el.querySelector('input,textarea,select,button.primary');
  if (first) setTimeout(() => first.focus(), 20);
  return api;
}

/* ---------- clipboard ---------- */
function toHTML(text) {
  return '<div style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5">' +
    esc(text).replace(/\n/g, '<br>') + '</div>';
}
async function toClipboard(text, { rich = false } = {}) {
  try {
    if (rich && window.ClipboardItem && navigator.clipboard?.write) {
      await navigator.clipboard.write([new ClipboardItem({
        'text/plain': new Blob([text], { type: 'text/plain' }),
        'text/html': new Blob([toHTML(text)], { type: 'text/html' })
      })]);
      return 'rich';
    }
  } catch (e) { /* fall through */ }
  try {
    if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); return 'plain'; }
  } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    ta.remove();
    if (ok) return 'legacy';
  } catch (e) { /* fall through */ }
  return 'fail';
}

const prefersDark = () => (typeof window.matchMedia === 'function' ? window.matchMedia('(prefers-color-scheme: dark)').matches : false);

/* ---------- render ---------- */
function applyTheme() {
  const s = Store.s.settings;
  const dark = s.theme === 'dark' || (s.theme === 'system' && prefersDark());
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.dataset.density = s.density;
  document.documentElement.style.setProperty('--accent', s.accent);
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#13151a' : '#f7f7f5');
}

function matchHay(t, q) {
  return [t.title, t.body, (t.tags || []).join(' '), Q.categoryName(t.category), t.useWhen || ''].join('\n').toLowerCase();
}
function visibleTemplates() {
  const s = Store.s;
  let list = [...s.templates];
  if (view.cat === 'fav') list = list.filter((t) => t.favorite);
  else if (view.cat === 'used') list = list.filter((t) => t.usage > 0);
  else if (view.cat === 'orphan') list = list.filter((t) => !s.categories.some((c) => c.id === t.category));
  else if (view.cat !== 'all') list = list.filter((t) => t.category === view.cat);
  if (view.tags.length) list = list.filter((t) => view.tags.every((tag) => (t.tags || []).includes(tag)));
  const q = view.q.trim().toLowerCase();
  if (q) {
    const words = q.split(/\s+/).filter(Boolean);
    list = list.filter((t) => words.every((w) => matchHay(t, w).includes(w)));
  }
  const catOrder = Object.fromEntries(s.categories.map((c, i) => [c.id, c.order ?? i]));
  const sort = s.settings.sort;
  if (q && sort === 'manual') {
    // relevance: title hits first
    list.sort((a, b) => score(b) - score(a));
  } else if (sort === 'recent') list.sort((a, b) => (b.lastUsed || '').localeCompare(a.lastUsed || '') || (a.order || 0) - (b.order || 0));
  else if (sort === 'az') list.sort((a, b) => a.title.localeCompare(b.title));
  else if (sort === 'used') list.sort((a, b) => (b.usage - a.usage) || a.title.localeCompare(b.title));
  else if (sort === 'new') list.sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  else if (sort === 'cat') list.sort((a, b) => (catOrder[a.category] - catOrder[b.category]) || (a.order - b.order));
  else list.sort((a, b) => (a.order || 0) - (b.order || 0));
  return list;

  function score(t) {
    const title = t.title.toLowerCase();
    let n = 0;
    if (title.includes(q)) n += 50;
    if (t.favorite) n += 6;
    n += Math.min(10, (t.usage || 0));
    n += matchHay(t, q).split(q).length - 1;
    return n;
  }
}

function render() {
  const app = document.getElementById('app');
  const s = Store.s;
  let mainHTML = '';
  if (view.tab === 'library') {
    const list = visibleTemplates();
    mainHTML = renderLibrary(list, !!(view.q.trim() || view.tags.length));
  } else if (view.tab === 'files') {
    const q = (view.fileQ || '').toLowerCase();
    mainHTML = renderFiles(s.files.filter((f) => !q || f.name.toLowerCase().includes(q) || (f.note || '').toLowerCase().includes(q)));
  } else if (view.tab === 'cases') {
    const q = view.q.trim().toLowerCase();
    let list = [...s.cases];
    if (q) list = list.filter((c) => [c.client, c.ticket, c.subject, c.notes, c.next, c.owner].join(' ').toLowerCase().includes(q));
    list.sort((a, b) => {
      const rank = { escalated: 0, new: 1, progress: 2, awaiting: 3, resolved: 4 };
      return (rank[a.status] - rank[b.status]) || (b.updatedAt || '').localeCompare(a.updatedAt || '');
    });
    mainHTML = renderCases(list);
  } else {
    mainHTML = renderSettings();
  }

  const selected = view.selected ? Q.template(view.selected) : null;
  app.innerHTML = renderTopbar() + renderRail() + `<main class="main">${mainHTML}</main>` +
    `<aside class="pane" id="pane">${selected ? renderPane(selected) : ''}</aside>`;
  app.classList.toggle('pane-open', !!selected);
  app.classList.toggle('rail-open', view.railOpen);
  const gs = document.getElementById('global-search');
  if (gs && document.activeElement !== gs) { gs.value = view.q; }
  updateStorageBadge();
  if (typeof applyChrome === 'function') applyChrome();
  if (typeof bindInternalDrag === 'function') bindInternalDrag(document.getElementById('app'));
  requestAnimationFrame(() => {
    if (view.selected && document.activeElement === document.body) sive(document.getElementById('pane'), { block: 'nearest' });
  });
}

/* ---------- copy flow ---------- */
async function copySubject(t) {
  if (!t) return;
  const r = fillVars(t.subject || '');
  const how = await toClipboard(r.text);
  Bus.toast(how === 'fail' ? 'Clipboard blocked — copy it from the panel instead' : 'Subject copied', how === 'fail' ? 'bad' : 'ok', 2200);
  if (r.missing.length) Bus.toast('Careful: ' + r.missing.map((k) => '{{' + k + '}}') + ' is still a placeholder', 'warn', 4000);
}

function composedBody(t) {
  let body = t.body;
  const s = Store.s.settings;
  if ((s.appendSignature || t.appendSig) && !t.noSig && s.signature) {
    body = body.replace(/\s*$/, '\n\n') + s.signature.trim() + '\n';
  }
  return body;
}

async function doCopy(text, { source, kind = 'tpl' } = {}) {
  const out = Store.s.settings.plainCopy ? text : text;
  const how = await toClipboard(out, { rich: !Store.s.settings.plainCopy });
  if (how === 'fail') {
    openModal(`
      <div class="modal-head"><h3>Couldn't reach the clipboard</h3><button class="btn icon ghost" data-close>${ICON.close}</button></div>
      <div class="modal-body">
        <p class="help" style="font-size:13px">Your browser blocked clipboard access from this page. The text is selected below — press <kbd>Ctrl</kbd>+<kbd>C</kbd> and it's yours.</p>
        <textarea class="txt" style="min-height:220px;font-family:var(--font)" id="fallback-copy">${esc(text)}</textarea>
      </div>
      <div class="modal-foot"><span class="grow"></span><button class="btn primary" data-close>Done</button></div>`,
      { wide: false, key: 'clip-fallback' });
    setTimeout(() => { const ta = document.getElementById('fallback-copy'); if (ta) { ta.focus(); ta.select(); } }, 40);
    return;
  }
  if (source) {
    Store.edit((st) => {
      if (kind === 'tpl') {
        const t = st.templates.find((x) => x.id === source);
        if (t) { t.usage = (t.usage || 0) + 1; t.lastUsed = nowISO(); }
      } else {
        const p = st.phrases.find((x) => x.id === source);
        if (p) p.usage = (p.usage || 0) + 1;
      }
      st.activity.unshift({
        id: uid('act'), at: nowISO(), kind: 'copy', ref: source, refKind: kind,
        title: kind === 'tpl' ? Q.template(source)?.title : (Q.phrase?.(source) || st.phrases.find(p => p.id === source))?.text?.slice(0, 40)
      });
      st.activity = st.activity.slice(0, 40);
    }, 'data');
  }
  const btns = document.querySelectorAll(`[data-act="copy"][data-id="${source}"]`);
  btns.forEach((b) => {
    const prev = b.innerHTML;
    b.classList.add('done');
    b.innerHTML = ICON.check + '<span>Copied</span>';
    setTimeout(() => { b.classList.remove('done'); b.innerHTML = prev; }, 1200);
  });
  Bus.toast('Copied to clipboard — paste with Ctrl+V', 'ok', 2000);
}

function noteSubjectOffer(t) {
  if (!t || !t.subject) return;
  Bus.toast('Body copied · subject ready too', 'ok', 6500, {
    label: 'Copy subject',
    fn() { copySubject(t); }
  });
}

function copyTemplate(id, { forceFill = false, noFill = false } = {}) {
  const t = Q.template(id);
  if (!t) return;
  const body = composedBody(t);
  const keys = varsIn(body);
  if (!keys.length) return doCopy(body, { source: id });
  const { missing } = fillVars(body);
  // "Fill & copy" always asks; a plain copy only asks when something is genuinely unknown
  if (forceFill || (missing.length && !noFill)) { openFillDialog(t, body, missing); return; }
  doCopy(fillVars(body).text, { source: id });
  noteSubjectOffer(t);
}

  });

  const m = openModal(`
    <div class="modal-head">

          ${opts.kind !== 'ph' ? `<div class="checkrow" style="margin-top:2px">

            <label for="fill-sig">Append my signature</label></div>` : ''}
        </div>
        <div class="right">
          <div class="pane-sec"><h4>${ICON.copy} Live preview</h4>
            <div class="prose" id="fill-preview" style="max-height:52vh;overflow:auto;font-size:13px"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-act="skip-fill">Skip, copy raw</button>
      ${entity.subject ? `<button class="btn" id="fill-subj-copy">${ICON.copy} Copy subject</button>` : ''}
      <span class="grow"></span>
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" id="fill-go">${ICON.copy} Copy filled text</button>
    </div>`, { wide: true, key: 'fill' });

  openFill = m;
  const inputs = [...m.el.querySelectorAll('input[data-var]')];
  const preview = m.el.querySelector('#fill-preview');
  const subjIn = m.el.querySelector('#fill-subj');
  function currentBody() {
    let body2 = entity.body ?? body;
    if (m.el.querySelector('#fill-sig')?.checked && Store.s.settings.signature) {
      body2 = String(body2).replace(/\s*$/, '\n\n') + Store.s.settings.signature.trim() + '\n';
    }
    return body2;
  }
  function draw() {
    const provided = Object.assign({}, opts.prefs || {});
    inputs.forEach((i) => { if (i.value.trim()) provided[i.dataset.var] = i.value; });
    const r = fillVars(currentBody(), provided);
    preview.innerHTML = renderProse(r.text);
    return provided;
  }
  inputs.forEach((i) => i.addEventListener('input', draw));
  m.el.querySelector('#fill-sig')?.addEventListener('change', draw);
  draw();
  const missingInput = inputs.find((i) => missing.includes(i.dataset.var));
  (missingInput || inputs[0])?.focus();
  (missingInput || inputs[0])?.select();

  m.el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); go(); }
  });
  m.el.querySelector('#fill-go').onclick = go;
  m.el.querySelector('#fill-subj-copy')?.addEventListener('click', async () => {
    const provided = draw();

    const r = fillVars(raw, provided);

    Bus.toast('Subject copied — now paste it in the subject field', 'ok', 2600);

    const provided = opts.prefs || {};

    doCopy(fillVars(currentBody(), provided).text, { source: entity.id, kind: opts.kind });
  };

  function go() {
    const provided = draw();
    Store.edit((st) => {
      if (st.settings.rememberFill) Object.assign(st.vars, provided);
      if (opts.caseId) {
        const c = st.cases.find((x) => x.id === opts.caseId);
        if (c) { c.history = c.history || []; c.history.unshift({ at: nowISO(), text: 'Copied "' + (entity.title || '') + '"' + (st.settings.appendSignature ? '' : '') }); c.updatedAt = nowISO(); }
      }
    }, 'data');
    m.close();
    const r = fillVars(currentBody(), provided);
    doCopy(r.text, { source: entity.id, kind: opts.kind });
    const still = fillVars(r.text).missing;
    if (still.length) Bus.toast('Heads-up: ' + still.map((k) => '{{' + k + '}}').join(', ') + ' still has no value', 'warn', 4200);
  }
}

      <span class="help" id="ed-status">${t ? 'Edited ' + ago(t.updatedAt) : 'Not saved yet'}</span>
      <span class="grow" style="flex:1"></span>
      <button class="btn" data-close>Cancel</button>
      ${t ? `<button class="btn" id="ed-copy-now">${ICON.copy} Copy now</button>` : ''}
      <button class="btn primary" id="ed-save">${ICON.check} Save</button>
    </div>`, { wide: true, key: 'editor' });

  const ta = m.el.querySelector('#ed-body');
  const titleIn = m.el.querySelector('#ed-title');
  m.el.querySelectorAll('[data-insert]').forEach((b) => {
    b.onclick = () => {
      const k = b.dataset.insert;
      const i = ta.selectionStart ?? ta.value.length;
      ta.value = ta.value.slice(0, i) + '{{' + k + '}}' + ta.value.slice(ta.selectionEnd ?? i);
      ta.focus();
      ta.setSelectionRange(i + k.length + 4, i + k.length + 4);
      ta.dispatchEvent(new Event('input'));
    };
  });
  ta.addEventListener('input', () => {
    const keys = varsIn(ta.value);
    m.el.querySelector('#ed-status').textContent = keys.length ? 'Variables: ' + keys.join(', ') : 'No placeholders — copies exactly as written';
    const vb = m.el.querySelector('#ed-varbar');
    const extra = keys.filter((k) => !['first_name', 'client_name', 'ticket_id', 'agent_name', 'issue', 'time_frame', 'date', 'team', 'link'].includes(k));
    vb.querySelectorAll('[data-extra]').forEach((x) => x.remove());
    extra.forEach((k) => {
      const b = document.createElement('button');
      b.className = 'chip on'; b.dataset.extra = '1'; b.dataset.insert = k; b.textContent = '{{' + k + '}}';
      b.onclick = () => { const i = ta.selectionStart ?? 0; ta.value = ta.value.slice(0, i) + '{{' + k + '}}' + ta.value.slice(i); ta.focus(); };
      vb.appendChild(b);
    });
  });
  ta.dispatchEvent(new Event('input'));

  m.el.querySelector('#ed-preview-btn').onclick = () => {
    openDraftPreview({
      title: titleIn.value || 'Untitled',
      subject: m.el.querySelector('#ed-subj').value,
      body: ta.value,
      useWhen: m.el.querySelector('#ed-use').value,
      tags: csv(m.el.querySelector('#ed-tags').value),
      category: m.el.querySelector('#ed-cat').value,
      id: t?.id || null
    });
  };
  m.el.querySelector('#ed-copy-now')?.addEventListener('click', () => copyTemplate(t.id));
  m.el.querySelector('#ed-save').onclick = () => save();
  m.el.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); save(); } });
  m.el.querySelector('#ed-title').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); save(); } });

  function save() {
    const title = titleIn.value.trim() || 'Untitled template';
    const body = ta.value.replace(/\r\n/g, '\n');
    const payload = {
      title, body,
      subject: m.el.querySelector('#ed-subj').value.trim(),
      category: m.el.querySelector('#ed-cat').value,
      tags: csv(m.el.querySelector('#ed-tags').value),
      useWhen: m.el.querySelector('#ed-use').value.trim(),
      favorite: m.el.querySelector('#ed-fav').checked,
      noSig: m.el.querySelector('#ed-nosig').checked
    };
    if (!body.trim()) { Bus.toast('Add some body text first — an empty template helps nobody', 'warn'); ta.focus(); return; }
    Store.edit((st) => {
      if (t) {
        const x = st.templates.find((y) => y.id === t.id);
        Object.assign(x, payload, { updatedAt: nowISO() });
      } else {
        const nid = uid('tpl');
        st.templates.push({
          id: nid, ...payload, usage: 0, pinned: false, custom: true,
          order: Math.max(0, ...st.templates.map((z) => z.order || 0)) + 1,
          fileIds: [], createdAt: nowISO(), updatedAt: nowISO(), lastUsed: null
        });
        view.selected = nid;
        view.tab = 'library';
        if (payload.category) view.cat = payload.category;
      }
    }, 'data');
    m.close();
    Bus.toast(t ? 'Template updated' : 'Template saved', 'ok');
    if (!t) selectTemplate(view.selected, { noScroll: true });
  }
}
/** what the client will actually read, from inside the editor */
function openDraftPreview(draft) {
  const filled = fillVars(draft.body).text;
  const subj = draft.subject ? fillVars(draft.subject).text : '';
  const missing = fillVars(draft.body).missing;
  const m = openModal(`
    <div class="modal-head">
      <h3>${esc(draft.title)}</h3>
      <span class="help">${missing.length ? '<span style="color:var(--warn)">' + missing.length + ' unfilled field' + (missing.length > 1 ? 's' : '') + '</span>' : 'no blanks left'}</span>
      <button class="btn icon ghost" data-close>${ICON.close}</button>
    </div>
    <div class="modal-body">
      ${subj ? `<div class="subj-row"><div class="subj">${renderProse(subj)}</div></div>` : ''}
      <div class="prose" style="font-size:15px">${renderProse(filled)}</div>
      <div class="help">This is the filled preview — exactly what lands in the clipboard. Blue bits are still placeholders.</div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>${ICON.arrow} Back to editing</button>
      <span class="grow" style="flex:1"></span>
      ${draft.id ? `<button class="btn" id="dp-copy">${ICON.copy} Copy this</button>` : ''}
    </div>`, { wide: true, key: 'draft-preview' });
  m.el.querySelector('#dp-copy')?.addEventListener('click', () => { copyTemplate(draft.id); m.close(); });
}

function csv(s) {
  return String(s || '').split(',').map((x) => x.trim().replace(/^#/, '')).filter(Boolean).slice(0, 8);
}

/* ---------- categories ---------- */
function openCatEditor(id) {
  const c = id ? Q.category(id) : null;
  const colors = CAT_COLORS;
  const m = openModal(`
    <div class="modal-head"><h3>${c ? 'Rename category' : 'New category'}</h3><button class="btn icon ghost" data-close>${ICON.close}</button></div>
    <div class="modal-body">
      <div class="form-row"><label class="lbl">Name</label><input id="cat-name" class="txt" value="${esc(c?.name || '')}" placeholder="e.g. Refunds"></div>
      <div class="form-row"><label class="lbl">What goes here (shown under the title)</label><input id="cat-desc" class="txt" value="${esc(c?.desc || '')}" style="font-size:13px"></div>
      <div class="form-row"><label class="lbl">Colour</label><div class="swatches">
        ${colors.map((x) => `<button class="swatch ${c?.color === x ? 'on' : ''}" data-color="${x}" style="background:${x}"></button>`).join('')}
      </div></div>
    </div>
    <div class="modal-foot"><span class="grow" style="flex:1"></span>
      ${c ? '<button class="btn danger" id="cat-del">Delete</button>' : ''}
      <button class="btn primary" id="cat-save">${ICON.check} Save</button></div>`, { narrow: true, key: 'cat' });
  let color = c?.color || colors[Math.floor(Math.random() * colors.length)];
  m.el.querySelectorAll('[data-color]').forEach((b) => {
    b.onclick = () => { color = b.dataset.color; m.el.querySelectorAll('[data-color]').forEach((x) => x.classList.toggle('on', x === b)); };
  });
  m.el.querySelector('#cat-save').onclick = () => {
    const name = m.el.querySelector('#cat-name').value.trim();
    if (!name) return Bus.toast('Give it a name', 'warn');
    Store.edit((st) => {
      if (c) { c.name = name; c.desc = m.el.querySelector('#cat-desc').value.trim(); c.color = color; }
      else st.categories.push({ id: 'cat_' + uid('c').slice(4), name, desc: m.el.querySelector('#cat-desc').value.trim(), color, order: Math.max(-1, ...st.categories.map((x) => x.order || 0)) + 1 });
    }, 'data');
    m.close();
  };
  m.el.querySelector('#cat-del')?.addEventListener('click', async () => {
    m.close();
    const n = Q.templatesIn(c.id).length;
    const ok = await Bus.confirm('Delete category “' + esc(c.name) + '”?',
      n ? 'The ' + n + ' template(s) inside are not deleted — they move to <b>No category</b>.' : 'Nothing is inside it.', 'Delete category');
    if (!ok) return;
    Store.edit((st) => {
      st.categories = st.categories.filter((x) => x.id !== c.id);
      st.templates.forEach((t) => { if (t.category === c.id) t.category = ''; });
    }, 'data');
    if (view.cat === c.id) view.cat = 'all';
  });
}

/* ---------- trash + undo ---------- */
function deleteTemplate(id) {
  const t = Q.template(id);
  if (!t) return;
  const copy = JSON.parse(JSON.stringify(t));
  const idx = Store.s.templates.findIndex((x) => x.id === id);
  Store.edit((st) => { st.templates = st.templates.filter((x) => x.id !== id); if (view.selected === id) { view.selected = null; } }, 'data');
  Bus.toast('Deleted “' + t.title.slice(0, 34) + '”', 'bad', 7000, {
    label: 'Undo',
    fn() {
      Store.edit((st) => { st.templates.splice(Math.min(idx, st.templates.length), 0, copy); }, 'data');
      Bus.toast('Restored', 'ok', 1500);
    }
  });
}

/* ---------- keyboard ---------- */
function bindKeys() {
  document.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
    const mod = e.metaKey || e.ctrlKey;

    if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
    if (mod && e.key.toLowerCase() === 'b') { e.preventDefault(); toggleRail(); return; }
    if (mod && e.key === 'Enter' && !typing) { e.preventDefault(); }
    if (e.key === 'Escape') {
      if (openPaletteInst) { closePalette(); return; }
      if (modalStack.length) { modalStack[modalStack.length - 1].close(); return; }
      if (view.selected) { view.selected = null; view.railOpen = false; render(); return; }
      if (view.railOpen) { view.railOpen = false; render(); }
      return;
    }
    if (modalStack.length && !typing) {
      // a modal has the stage: only Esc (handled above) or its own keys apply
      if (!(e.metaKey || e.ctrlKey) && /^(n|c|e|j|k|f|\?|\/) $/.test('')) return;
      if (['n', 'e', 'c', 'j', 'k', 'f', '/', '?'].includes(e.key.toLowerCase()) && !mod) { e.preventDefault(); return; }
    }
    if (typing) {
      if (e.target.id === 'global-search') {
        if (e.key === 'Enter') { e.preventDefault(); const l = visibleTemplates(); if (l[0]) { selectTemplate(l[0].id); } }
        if (e.key === 'Escape') { view.q = ''; e.target.value = ''; render(); }
      }
      return;
    }
    if (e.key === '/') { e.preventDefault(); document.getElementById('global-search')?.focus(); return; }
    if (e.key === '?') { e.preventDefault(); openHelp(); return; }
    if (e.key.toLowerCase() === 'n' && !mod) { e.preventDefault(); openEditor(); return; }
    if (e.key.toLowerCase() === 'f' && !mod) { e.preventDefault(); toggleTheme(); return; }
    if ((e.key.toLowerCase() === 'c' || e.key === 'Enter') && view.selected) { e.preventDefault(); copyTemplate(view.selected); return; }
    if (e.key.toLowerCase() === 'e' && view.selected) { e.preventDefault(); openEditor(view.selected); return; }
    if (e.key === 'j' || e.key === 'ArrowDown') {
      const list = visibleTemplates();
      if (!list.length) return;
      e.preventDefault();
      const i = list.findIndex((t) => t.id === view.selected);
      selectTemplate(list[Math.min(list.length - 1, i + 1)].id);
      return;
    }
    if (e.key === 'k' || e.key === 'ArrowUp') {
      const list = visibleTemplates();
      if (!list.length) return;
      e.preventDefault();
      const i = list.findIndex((t) => t.id === view.selected);
      selectTemplate(list[Math.max(0, i <= 0 ? 0 : i - 1)].id);
      return;
    }
    if (/^[1-9]$/.test(e.key) && view.tab === 'library') {
      const cats = [...Store.s.categories].sort((a, b) => a.order - b.order);
      const n = parseInt(e.key, 10);
      const c = cats[n - 1];
      if (c) { e.preventDefault(); view.cat = c.id; render(); }
    }
  });
}

function toggleTheme() {
  const cur = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
  Store.edit((st) => { st.settings.theme = cur === 'dark' ? 'light' : 'dark'; }, 'ui');
  applyTheme();
  Bus.toast(cur === 'dark' ? 'Light' : 'Dark', '', 1100);
}

/* ---------- misc ---------- */
function togglePaneOpen() { if (view.selected) { view.selected = null; render(); } }
function updateStorageBadge() {
  const el = document.getElementById('storage-used');
  if (!navigator.storage?.estimate) { if (el) el.textContent = 'unknown'; }
  else if (el) {
    navigator.storage.estimate().then((r) => {
      if (!document.getElementById('storage-used')) return;
      document.getElementById('storage-used').textContent = bytes(r.usage || 0) + ' used' + (r.quota ? ' of ~' + bytes(r.quota) : '');
    }).catch(() => { el.textContent = 'unknown'; });
  }

  /* the database card on the Settings tab */
  const sum = document.getElementById('db-summary');
  const tablesEl = document.getElementById('db-tables');
  const lastEl = document.getElementById('db-last');
  if (!sum && !tablesEl) return;
  Promise.resolve(Store.stats()).then((st) => {
    if (sum && !document.getElementById('db-summary')) return;      // re-rendered meanwhile
    const t = st.tables || {};
    const label = { templates: 'templates', phrases: 'phrases', categories: 'categories', files: 'files', cases: 'cases', blobs: 'files stored as bytes', activity: 'recent copies', vars: 'remembered {{placeholders}}', trash: 'in undo', settings: 'settings row', meta: 'meta rows' };
    const chips = ['templates', 'phrases', 'categories', 'files', 'cases', 'blobs', 'activity']
      .filter((k) => t[k] != null)
      .map((k) => `<span class="chip" style="pointer-events:none">${t[k]} ${label[k] || k}</span>`).join('');
    const engine = st.engine === 'idb'
      ? `<b>IndexedDB</b> · database “${esc(st.db)}” · schema v${st.dbVersion} (records v${st.stateSchema})`
      : `<b>localStorage</b> fallback · the browser refused to open a database (${esc(st.error || 'no reason given')})`;
    const bytesLine = st.usage && st.usage.usage != null
      ? `<span>·</span><span>${bytes(st.usage.usage)} of ~${bytes(st.usage.quota || 0)} on disk</span>` : '';
    if (sum) sum.innerHTML = `${engine}${bytesLine}`;
    if (tablesEl) tablesEl.innerHTML = chips;
    if (lastEl) {
      const when = st.lastSavedAt ? ago(st.lastSavedAt) : (Store.isDirty ? 'writing…' : 'nothing to write yet');
      lastEl.textContent = when + (st.device ? ' · window ' + st.device.slice(4, 8) : '');
    }
  }).catch(() => { if (sum) sum.textContent = 'database stats unavailable'; });
}
</script>
<script data-src="src/js/panels.js">
/* =========================================================
   panels.js — resource shelf (files), drag & drop, paste,
   live cases board, phrase editing
   ========================================================= */

const MAX_IDB = 50 * 1024 * 1024;   // per file, IndexedDB mode
const MAX_KV = 1.2 * 1024 * 1024;   // per file, fallback mode

/* ---------- ingest ---------- */
async function ingestFiles(fileList, target) {
  const files = [...fileList];
  if (!files.length) return;
  const added = [];
  let skipped = 0;
  for (const f of files) {
    const cap = Store.Vault.mode === 'idb' ? MAX_IDB : MAX_KV;
    if (f.size > cap) {
      // too big to keep locally: store a labelled shortcut so you know it exists
      const rec = { id: uid('f'), name: (f.name || 'large file'), kind: 'shortcut', mime: (f.type || 'application/octet-stream').split(';')[0], size: f.size, at: nowISO(), note: 'not stored — too big for this browser' };
      Store.edit((st) => { st.files.unshift(rec); if (target?.id) linkFile(st, target, rec.id); }, 'data');
      added.push(rec);
      skipped++;
      continue;
    }
    const baseName = (typeof f.name === 'string' && f.name.trim())
      ? f.name.trim()
      : 'pasted ' + new Date().toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }).replace(/[/,:\s]/g, '-');
    const name = (baseName.length > 70 ? baseName.slice(0, 64) + '-' + (baseName.split('.').pop() || '') : baseName).slice(0, 90);
    const mime = ((f.type || 'application/octet-stream').split(';')[0]);
    const rec = { id: uid('f'), name, kind: 'file', mime, size: f.size || 0, at: nowISO(), note: '' };
    try {
      const res = await Store.Vault.put(rec.id, typeof f.slice === 'function' ? f.slice(0, f.size) : f);
      rec.stored = res.kind;
      if (res.kind !== 'idb' && res.dataUrl && looksTextual(rec)) {
        // keep a readable copy in the record itself so text stays usable even if the blob is lost
        try { rec.snippet = await readBlobText(f, 40000); } catch (e) {}
      } else if (looksTextual(rec)) {
        try { rec.snippet = (await readBlobText(f, 40000)); } catch (e) {}
      }
      if (rec.snippet) rec.lines = (rec.snippet.match(/\n/g) || []).length + 1;
    } catch (e) {
      rec.missing = true; rec.note = 'could not be saved locally';
    }
    // the record is saved NOW — the picture preview catches up a moment later
    Store.edit((st) => { st.files.unshift(rec); if (target?.id) linkFile(st, target, rec.id); }, 'data');
    added.push(rec);
    if (/^image\//.test(mime)) {
      withTimeout(makeThumb(f), 4000).then((thumb) => {
        Store.edit((st) => { const x = st.files.find((y) => y.id === rec.id); if (x) x.thumb = thumb; }, 'data');
      }).catch(() => {});
    }
  }
  const targetLabel = !target ? 'the shelf'
    : target.kind === 'tpl' ? '“' + (Q.template(target.id)?.title || 'template') + '”'
    : 'case ' + (Store.s.cases.find((c) => c.id === target.id)?.client || '');
  if (added.length) {
    Bus.toast(`${added.length} file${added.length > 1 ? 's' : ''} added to ${targetLabel}` + (skipped ? ` · ${skipped} too large, saved as a shortcut` : ''), skipped ? 'warn' : 'ok', 3200, {
      label: 'View', fn() { view.tab = 'files'; render(); }
    });
  }
  render();
}
function linkFile(st, target, fileId) {
  if (target.kind === 'tpl') {
    const t = st.templates.find((x) => x.id === target.id);
    if (t) { t.fileIds = [...new Set([...(t.fileIds || []), fileId])]; t.updatedAt = nowISO(); }
  } else if (target.kind === 'case') {
    const c = st.cases.find((x) => x.id === target.id);
    if (c) { c.fileIds = [...new Set([...(c.fileIds || []), fileId])]; c.updatedAt = nowISO(); }
  }
}
function unlinkFile(target, fileId) {
  Store.edit((st) => {
    if (target.kind === 'tpl') { const t = st.templates.find((x) => x.id === target.id); if (t) t.fileIds = (t.fileIds || []).filter((i) => i !== fileId); }
    if (target.kind === 'case') { const c = st.cases.find((x) => x.id === target.id); if (c) c.fileIds = (c.fileIds || []).filter((i) => i !== fileId); }
  }, 'data');
}
function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error('slow')), ms))]);
}
function makeThumb(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const max = 360;
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.62));
      } catch (e) { rej(e); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { try { URL.revokeObjectURL(url); } catch (e) {} rej(new Error('img')); };
    img.src = url;
  });
}

/* ---------- open / preview ---------- */
const safeURL = (u) => (/^(https?:|mailto:)/i.test(String(u || '').trim()) ? String(u).trim() : null);
async function openFile(id) {
  const f = Q.file(id);
  if (!f) return;
  if (f.kind === 'link') {
    const u = safeURL(f.url);
    if (!u) { Bus.toast('That saved link is not an http(s) address, so I will not open it', 'bad', 4000); return; }
    window.open(u, '_blank', 'noopener');
    return;
  }
  const isText = looksTextual(f);
  const isImg = /^image\//.test(f.mime || '');
  const isPdf = f.mime === 'application/pdf';
  let blob = null;
  try { blob = await Store.Vault.get(id); } catch (e) { blob = null; }

  if (!blob) {
    if (isText && f.snippet != null) return showTextPreview(f, f.snippet, id);
    if (f.kind === 'shortcut' || f.missing) {
      const input = document.createElement('input');
      input.type = 'file';
      input.onchange = () => { const nf = input.files && input.files[0]; if (nf) { const u = URL.createObjectURL(nf); isImg ? showImagePreview(f, u, id) : isText ? readBlobText(nf, 200000).then((t) => showTextPreview(f, t, id)) : downloadFile(id); } };
      input.click();
      Bus.toast('That one is stored as a shortcut — pick the file to open it just now', 'warn', 4000);
      return;
    }
    Bus.toast('The bytes for that file are gone from this browser — re-drop it', 'bad', 4000);
    return;
  }
  let url = '';
  try { url = URL.createObjectURL(blob); } catch (e) { url = ''; }
  if (isText) {
    const t = await readBlobText(blob, 200000);
    return showTextPreview(f, t, id, url);
  }
  if (isImg) return showImagePreview(f, url, id);
  if (isPdf) return showIframePreview(f, url, id);
  if (url) {
    const win = window.open(url, '_blank', 'noopener');
    if (!win) { downloadFile(id); Bus.toast('Preview blocked — downloaded instead', 'warn', 2600); }
    return;
  }
  downloadFile(id);
}
function showImagePreview(f, url, id) {
  const m = openModal(`
    <div class="modal-head"><h3>${esc(f.name)}</h3><button class="btn icon ghost" data-close>${ICON.close}</button></div>
    <div class="modal-body" style="align-items:center;background:var(--panel-2)">
      <img src="${url}" style="max-width:100%;max-height:66vh;border-radius:8px;display:block" alt="">
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="downloadFile('${id}')">${ICON.download} Download</button>
      <button class="btn ghost" style="color:var(--bad)" onclick="deleteFile('${id}'); (modalStack[modalStack.length-1]||{}).close && modalStack[modalStack.length-1].close()">${ICON.trash} Delete</button>
      <span class="grow" style="flex:1"></span>
      <span class="help">${bytes(f.size)} · added ${ago(f.at)} · drag the card in the library to attach it</span>
    </div>`, { wide: true, key: 'fileimg' });
}
function showIframePreview(f, url, id) {
  openModal(`
    <div class="modal-head"><h3>${esc(f.name)}</h3><button class="btn icon ghost" data-close>${ICON.close}</button></div>
    <div class="modal-body" style="padding:0"><iframe src="${url}" style="width:100%;height:70vh;border:0"></iframe></div>
    <div class="modal-foot"><button class="btn" onclick="downloadFile('${id}')">${ICON.download} Download</button>
      <span class="grow" style="flex:1"></span><span class="help">If the preview is blocked, use Download.</span></div>`, { wide: true, key: 'filepdf' });
}
function showTextPreview(f, text, id, url) {
  const clipped = text.length > 200000;
  const m = openModal(`
    <div class="modal-head"><h3>${esc(f.name)}</h3><span class="help">${(text.length).toLocaleString()} chars${clipped ? ' (first 200k shown)' : ''}</span>
      <button class="btn icon ghost" data-close>${ICON.close}</button></div>
    <div class="modal-body"><pre class="prose" style="white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;max-height:62vh;overflow:auto">${esc(text)}</pre></div>
    <div class="modal-foot">
      <button class="btn primary" id="tx-copy">${ICON.copy} Copy all</button>
      <button class="btn" id="tx-tpl">${ICON.plus} Turn into template</button>
      <button class="btn" id="tx-parts">${ICON.plus} One template per section</button>
      <span class="grow" style="flex:1"></span>
      <button class="btn" onclick="downloadFile('${id}')">${ICON.download} Download</button>
    </div>`, { wide: true, key: 'filetext' });
  m.el.querySelector('#tx-copy').onclick = async () => { await toClipboard(text); Bus.toast('Copied', 'ok', 1500); };
  m.el.querySelector('#tx-tpl').onclick = () => {
    openEditor(null, { title: f.name.replace(/\.[a-z0-9]+$/i, ''), body: text.trim().slice(0, 8000) });
    Bus.toast('Draft from ' + f.name, '', 1600);
  };
  m.el.querySelector('#tx-parts').onclick = () => {
    const parts = text.split(/\n(?=(?:#{1,3}\s|={3,}|-{3,}$|[A-Z][A-Za-z .,&'’()-]{3,50}:$))/).map((p) => p.trim()).filter((p) => p.length > 24);
    if (parts.length < 2) { Bus.toast('I could only find one chunk in that file', 'warn'); return; }
    Store.edit((st) => {
      parts.forEach((p, n) => {
        const first = p.split('\n')[0].replace(/^#+\s*/, '').slice(0, 70);
        st.templates.push({
          id: uid('tpl'), title: first || ('From ' + f.name + ' #' + (n + 1)), category: '',
          tags: ['imported'], body: p, useWhen: 'Imported from ' + f.name, favorite: false, usage: 0, pinned: false,
          order: Math.max(0, ...st.templates.map((t) => t.order || 0)) + 1 + n, fileIds: [], createdAt: nowISO(), updatedAt: nowISO(), lastUsed: null
        });
      });
    }, 'data');
    Bus.toast(parts.length + ' templates created from ' + f.name, 'ok', 3000, { label: 'Open', fn() { view.tab = 'library'; view.cat = 'all'; view.q = 'imported'; render(); } });
  };
}
function downloadFile(id) {
  const f = Q.file(id);
  if (!f) return;
  if (f.kind === 'link') { const u = safeURL(f.url); if (u) window.open(u, '_blank', 'noopener'); return; }
  const go = (blob) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  Store.Vault.get(id).then((b) => {
    if (b) return go(b);
    if (f.snippet != null) return go(new Blob([f.snippet], { type: 'text/plain' }));
    Bus.toast('The bytes for that file are no longer here — re-drop it to open it', 'warn', 4200);
  }).catch(() => { if (f.snippet != null) go(new Blob([f.snippet], { type: 'text/plain' })); });
}
function fileOptions(id) {
  const f = Q.file(id);
  if (!f) return;
  const tpls = Store.s.templates.filter((t) => (t.fileIds || []).includes(id));
  const m = openModal(`
    <div class="modal-head"><h3>${esc(f.name)}</h3><button class="btn icon ghost" data-close>${ICON.close}</button></div>
    <div class="modal-body">
      <div class="meta-row"><span>${f.kind === 'link' ? 'Link' : bytes(f.size)}</span><span>·</span><span>added ${ago(f.at)}</span>
      ${f.stored ? `<span>·</span><span>stored in ${f.stored === 'idb' ? 'IndexedDB' : 'local storage'}</span>` : ''}</div>
      <div class="form-row"><label class="lbl">Note to myself (e.g. “use for refund cases”)</label>
        <input class="txt" id="fn-note" value="${esc(f.note || '')}" style="font-size:13px"></div>
      <div class="form-row"><label class="lbl">Rename</label><input class="txt" id="fn-name" value="${esc(f.name)}" style="font-size:13px"></div>
      <div class="form-row"><label class="lbl">Attached to</label>
        ${tpls.length ? `<div class="tagchips">${tpls.map((t) => `<button class="chip" data-act="detach" data-id="${id}" data-tpl="${t.id}">${esc(t.title)} ✕</button>`).join('')}</div>` : '<span class="help">Nothing — the shelf only. Drag it onto a card to attach.</span>'}
      </div>
      <div class="form-row"><label class="lbl">Attach to a template</label>
        <select class="txt" id="fn-attach">${Store.s.templates.map((t) => `<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select></div>
    </div>
    <div class="modal-foot"><button class="btn danger" id="f-del">${ICON.trash} Delete</button><span class="grow" style="flex:1"></span>
      <button class="btn" id="f-close">Done</button><button class="btn primary" id="f-save">Save</button></div>`, { narrow: false, key: 'fileopt' });
  m.el.querySelector('#f-save').onclick = () => {
    Store.edit((st) => {
      const x = st.files.find((y) => y.id === id);
      x.note = m.el.querySelector('#fn-note').value.trim();
      x.name = m.el.querySelector('#fn-name').value.trim() || x.name;
    }, 'data');
    m.close();
  };
  m.el.querySelector('#f-attach').onchange = (e) => {
    const tplId = e.target.value;
    if (!tplId) return;
    Store.edit((st) => linkFile(st, { kind: 'tpl', id: tplId }, id), 'data');
    Bus.toast('Attached to ' + Q.template(tplId).title, 'ok', 2000);
    m.close();
  };
  m.el.querySelector('#f-close').onclick = () => m.close();
  m.el.querySelector('#f-del').onclick = () => { m.close(); deleteFile(id); };
}
function deleteFile(id) {
  const f = Q.file(id);
  if (!f) return;
  const snapshot = JSON.parse(JSON.stringify(Store.s));
  Bus.confirm('Delete “' + esc(f.name) + '”?', 'It will be detached from every template that uses it. The blob is removed from this browser too.', 'Delete file').then((ok) => {
    if (!ok) return;
    Store.Vault.del(id);
    Store.edit((st) => {
      st.files = st.files.filter((x) => x.id !== id);
      st.templates.forEach((t) => { t.fileIds = (t.fileIds || []).filter((i) => i !== id); });
      st.cases.forEach((c) => { c.fileIds = (c.fileIds || []).filter((i) => i !== id); });
    }, 'data');
    Bus.toast('File deleted', 'bad', 6000, { label: 'Undo', fn() { Store.replaceAll(snapshot); Bus.toast('Restored', 'ok', 1400); } });
  });
}

/* ---------- global drag & drop ---------- */
let dropTarget = null;
let dragDepth = 0;
function bindDnD() {
  const overlay = document.getElementById('drop-overlay');
  const types = (e) => Array.from(e.dataTransfer?.types || []);
  const isInternal = (e) => types(e).includes('application/x-osr-file');
  const hasFiles = (e) => types(e).includes('Files');
  const hasText = (e) => Array.from(e.dataTransfer?.types || []).some((t) => t === 'text/plain' || t === 'text/uri-list');
  const hasJSON = (e) => e.dataTransfer?.items && [...e.dataTransfer.items].some((i) => i.kind === 'file' && /json|csv|text/.test(i.type));

  window.addEventListener('dragenter', (e) => {
    if (!hasFiles(e) && !hasText(e) && !isInternal(e)) return;
    e.preventDefault();
    dragDepth++;
    if (isInternal(e)) {
      const card = e.target.closest('.card, .pane, tr[data-case]');
      if (card) card.classList.add('drag-over');
    }
    overlay.classList.add('on');
    overlay.querySelector('.box').innerHTML = dropTarget
      ? `Attach to <b>${esc(dropTarget.label)}</b><small>drop here · or release elsewhere for the resource shelf</small>`
      : `Drop to add to your shelf<small>${hasFiles(e) ? e.dataTransfer.files.length + ' file(s)' : 'text / link'} · files attach to this PC only</small>`;
  });
  window.addEventListener('dragover', (e) => {
    if (!hasFiles(e) && !hasText(e) && !isInternal(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    const card = e.target.closest?.('.card, tr[data-case], .file-card, .pane');
    document.querySelectorAll('.drag-over').forEach((x) => x.classList.remove('drag-over'));
    if (card?.classList.contains('card')) {
      const t = Q.template(card.dataset.id);
      if (t) { card.classList.add('drag-over'); dropTarget = { kind: 'tpl', id: t.id, label: t.title.slice(0, 28) }; }
    } else if (card?.tagName === 'TR') {
      const c = Store.s.cases.find((x) => x.id === card.dataset.case);
      if (c) { card.classList.add('drag-over'); dropTarget = { kind: 'case', id: c.id, label: c.client || 'case' }; }
    } else if (card?.classList.contains('pane')) {
      const t = Q.template(view.selected);
      if (t) dropTarget = { kind: 'tpl', id: t.id, label: t.title.slice(0, 28) };
    } else if (!hasJSON(e)) {
      dropTarget = null;
    }
  });
  window.addEventListener('dragleave', (e) => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) { overlay.classList.remove('on'); document.querySelectorAll('.drag-over').forEach((x) => x.classList.remove('drag-over')); }
  });
  window.addEventListener('drop', async (e) => {
    if (!hasFiles(e) && !hasText(e) && !isInternal(e)) return;
    e.preventDefault();
    dragDepth = 0;
    overlay.classList.remove('on');
    document.querySelectorAll('.drag-over').forEach((x) => x.classList.remove('drag-over'));
    const target = dropTarget;
    dropTarget = null;
    // dragging one of my own shelf files onto a template/case = attach it (no copy)
    const moved = e.dataTransfer.getData('application/x-osr-file');
    if (moved) {
      document.querySelectorAll('.drag-over').forEach((x) => x.classList.remove('drag-over'));
      if (!target) { Bus.toast('Drop it on a template card or a case row to attach it there', 'warn', 3200); return; }
      Store.edit((st) => linkFile(st, target, moved), 'data');
      Bus.toast('Attached to ' + target.label, 'ok', 2200);
      render();
      return;
    }
    if (e.dataTransfer.files?.length) {
      const fs = [...e.dataTransfer.files];
      const json = fs.filter((f) => /\.json$/i.test(f.name));
      const csvf = fs.filter((f) => /\.csv$/i.test(f.name));
      const rest = fs.filter((f) => !json.includes(f) && !csvf.includes(f));
      if (json.length && !rest.length && !target) { importFile(json[0]); return; }
      if (csvf.length && !rest.length && !target) { importFile(csvf[0]); return; }
      await ingestFiles(rest.length ? rest : fs, target);
      if (json.length || csvf.length) { await new Promise((r) => setTimeout(r, 60)); importFile(json[0] || csvf[0]); }
      return;
    }
    const txt = e.dataTransfer.getData('text/plain') || e.dataTransfer.getData('text/uri-list');
    if (!txt || !txt.trim()) return;
    if (/^https?:\/\//i.test(txt.trim()) && !target) {
      saveLink(txt.trim());
    } else {
      const body = txt.trim();
      const name = 'Dropped note ' + new Date().toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + '.txt';
      const blob = new Blob([body], { type: 'text/plain' });
      blob.name = name; blob.type = 'text/plain';
      await ingestFiles([blob], target);
    }
  });

  // paste an image or text right into the desk
  window.addEventListener('paste', async (e) => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
    const dt = e.clipboardData;
    if (!dt) return;
    const imgs = [...dt.items].filter((i) => i.kind === 'file' && /^image\//.test(i.type));
    if (imgs.length) {
      e.preventDefault();
      const files = imgs.map((it, n) => { const f = it.getAsFile(); return f; });
      const named = files.map((f, n) => { const nb = new Blob([f], { type: f.type }); nb.name = 'pasted ' + new Date().toLocaleTimeString().replace(/:/g, '') + (n ? ' ' + n : '') + '.png'; return nb; });
      await ingestFiles(named, null);
      Bus.toast('Pasted screenshot saved to your shelf', 'ok');
      return;
    }
    const txt = dt.getData('text/plain');
    if (txt && txt.trim().length > 120) {
      const m = openModal(`
        <div class="modal-head"><h3>Turn that paste into a template?</h3><button class="btn icon ghost" data-close>${ICON.close}</button></div>
        <div class="modal-body">
          <div class="form-row"><label class="lbl">Title</label><input id="pt-title" class="txt" value="${esc(txt.trim().split('\n')[0].slice(0, 60))}" style="font-size:14px;font-weight:600"></div>
          <div class="form-row"><label class="lbl">Body</label><textarea class="txt" id="pt-body" style="min-height:190px">${esc(txt.trim().slice(0, 6000))}</textarea></div>
        </div>
        <div class="modal-foot"><button class="btn" id="pt-as-file">${ICON.file} Save as note</button><span class="grow" style="flex:1"></span>
          <button class="btn" data-close>Discard</button><button class="btn primary" id="pt-save">${ICON.check} Save template</button></div>`, { wide: true, key: 'paste' });
      m.el.querySelector('#pt-save').onclick = () => {
        openEditor(null, { title: m.el.querySelector('#pt-title').value, body: m.el.querySelector('#pt-body').value });
        m.close();
      };
      m.el.querySelector('#pt-as-file').onclick = async () => {
        const blob = new Blob([m.el.querySelector('#pt-body').value], { type: 'text/plain' });
        blob.name = 'pasted ' + new Date().toLocaleTimeString().replace(/:/g, '') + '.txt';
        m.close();
        await ingestFiles([blob], null);
      };
    }
  });
}
function bindInternalDrag(root) {
  (root || document).querySelectorAll?.('.file-card[draggable="true"]').forEach((card) => {
    if (card.__dragBound) return;
    card.__dragBound = 1;
    card.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('application/x-osr-file', card.dataset.file);
      e.dataTransfer.setData('text/osr-file', card.dataset.file);
      e.dataTransfer.effectAllowed = 'copyLink';
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach((x) => x.classList.remove('drag-over'));
      const o = document.getElementById('drop-overlay');
      if (o) o.classList.remove('on');
    });
  });
}

function saveLink(rawUrl, note) {
  const url = String(rawUrl || '').trim();
  if (!safeURL(url)) { Bus.toast('Only http(s) links can be saved', 'warn', 3000); return; }
  const host = url.replace(/^https?:\/\//, '').split('/')[0];
  const name = note || host + url.slice(host.length + 8).split('/').filter(Boolean).slice(-1)[0] || 'Saved link';
  Store.edit((st) => st.files.unshift({ id: uid('f'), name: String(name).slice(0, 60) || host, kind: 'link', url, size: 0, at: nowISO(), note: '' }), 'data');
  Bus.toast('Link saved to shelf', 'ok', 2400, { label: 'View', fn() { view.tab = 'files'; render(); } });
}

/* ---------- cases ---------- */
function caseVars(c) {
  const first = (c.contact || c.client || '').split(/\s+/)[0] || '';
  return {
    client_name: c.client || '', first_name: first, ticket_id: c.ticket || '',
    case_summary: c.subject || '', issue: c.subject || '', agent_name: Store.s.settings.yourName || ''
  };
}
function openCaseEditor(id) {
  const c = id ? Store.s.cases.find((x) => x.id === id) : null;
  const m = openModal(`
    <div class="modal-head"><h3>${c ? 'Case · ' + esc(c.client || c.ticket || 'untitled') : 'New case'}</h3><button class="btn icon ghost" data-close>${ICON.close}</button></div>
    <div class="modal-body">
      <div class="form-row two">
        <div class="form-row"><label class="lbl">Client / account</label><input class="txt" id="cy-client" value="${esc(c?.client || '')}" placeholder="Acme Ltd"></div>
        <div class="form-row"><label class="lbl">Contact name</label><input class="txt" id="cy-contact" value="${esc(c?.contact || '')}" placeholder="Sam Rivera"></div>
      </div>
      <div class="form-row two">

        <div class="form-row"><label class="lbl">Subject</label><input class="txt" id="cy-subject" value="${esc(c?.subject || '')}" placeholder="Can't log in after reset"></div>
      </div>
      <div class="form-row two">
        <div class="form-row"><label class="lbl">Status</label><select class="txt" id="cy-status">${CASE_STATUS.map(([v, l]) => `<option value="${v}" ${c?.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div class="form-row"><label class="lbl">Priority</label><select class="txt" id="cy-prio">${CASE_PRIO.map(([v, l]) => `<option value="${v}" ${c?.priority === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>

      ${c?.history?.length ? `<div class="pane-sec"><h4>Trail</h4><div class="help" style="font-size:12px;line-height:1.7">${c.history.slice(0, 8).map((h) => `<div><b>${ago(h.at)}</b> · ${esc(h.text)}</div>`).join('')}</div></div>` : ''}
      ${c?.fileIds?.length ? `<div class="pane-sec"><h4>Files on this case</h4><div class="tagchips">${c.fileIds.map((f) => Q.file(f)).filter(Boolean).map((f) => `<button class="chip" data-act="open-file" data-id="${f.id}">${ICON.file} ${esc(f.name.slice(0, 22))}</button>`).join('')}</div></div>` : ''}
    </div>
    <div class="modal-foot">${c ? `<button class="btn danger" id="cy-del">${ICON.trash} Delete case</button>` : ''}
      <span class="grow" style="flex:1"></span>

      <button class="btn primary" id="cy-save">${ICON.check} Save</button></div>`, { wide: true, key: 'case' });

      next: g('#cy-next'), notes: g('#cy-notes'), updatedAt: nowISO()

      if (c) { Object.assign(st.cases.find((x) => x.id === c.id), patch); }
      else st.cases.unshift({ id: uid('case'), ...patch, fileIds: [], history: [{ at: nowISO(), text: 'created' }], createdAt: nowISO() });
    }, 'data');
    m.close();
    view.tab = 'cases';
    Bus.toast(c ? 'Case updated' : 'Case added to your board', 'ok');
  };
  m.el.querySelector('#cy-del')?.addEventListener('click', () => {
    m.close();
    const snapshot = JSON.parse(JSON.stringify(Store.s));
    Store.edit((st) => { st.cases = st.cases.filter((x) => x.id !== c.id); }, 'data');
    Bus.toast('Case deleted', 'bad', 6000, { label: 'Undo', fn() { Store.replaceAll(snapshot); } });
  });
}

/* ---------- phrase ---------- */
function openPhraseEditor(id) {
  const p = id ? Store.s.phrases.find((x) => x.id === id) : null;
  const m = openModal(`
    <div class="modal-head"><h3>${p ? 'Edit phrase' : 'New grab-and-go line'}</h3><button class="btn icon ghost" data-close>${ICON.close}</button></div>
