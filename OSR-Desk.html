<style>
/* =========================================================
   OSR Desk — quiet, local-first workspace for support reps
   ========================================================= */

:root {
  --accent: #2f6df6;
  --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
  --accent-line: color-mix(in srgb, var(--accent) 35%, transparent);

  --bg: #f7f7f5;
  --panel: #ffffff;
  --panel-2: #fbfbf9;
  --rail: #f2f2ef;
  --ink: #191b1e;
  --ink-2: #52565c;
  --ink-3: #858a91;
  --line: #e4e4df;
  --line-2: #ededE8;
  --ok: #1f8a5a;
  --warn: #b0750d;
  --bad: #c1362f;
  --info: #2f6df6;

  --radius: 10px;
  --radius-sm: 7px;
  --shadow-1: 0 1px 2px rgba(20, 22, 25, .05);
  --shadow-2: 0 6px 24px -6px rgba(20, 22, 25, .16), 0 1px 3px rgba(20, 22, 25, .06);
  --shadow-3: 0 24px 60px -12px rgba(20, 22, 25, .28), 0 4px 14px rgba(20, 22, 25, .1);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --fs: 14px;
  --fs-body: 14.5px;
  --card-pad: 14px;
  --row-gap: 10px;
}

html[data-theme="dark"] {
  --bg: #13151a;
  --panel: #1a1d24;
  --panel-2: #171a21;
  --rail: #101216;
  --ink: #e9ebee;
  --ink-2: #a8aeb7;
  --ink-3: #767d87;
  --line: #272b34;
  --line-2: #21252d;
  --ok: #4ac487;
  --warn: #e0a63f;
  --bad: #f4736a;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 8px 28px -8px rgba(0, 0, 0, .6), 0 1px 3px rgba(0, 0, 0, .4);
  --shadow-3: 0 28px 70px -14px rgba(0, 0, 0, .75), 0 4px 14px rgba(0, 0, 0, .5);
}

html[data-density="compact"] {
  --card-pad: 10px;
  --row-gap: 6px;
  --fs-body: 13.5px;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: var(--fs);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

@media (prefers-reduced-motion: no-preference) {
  * { scroll-behavior: smooth; }
  .card, .btn, .chip, .rail-item { transition: background .14s ease, border-color .14s ease, color .14s ease, box-shadow .14s ease, transform .14s ease; }
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: color-mix(in srgb, var(--accent) 24%, transparent); }

/* ---------- scrollbars ---------- */
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--ink-3) 32%, transparent); border: 3px solid transparent; background-clip: content-box; border-radius: 99px; }
*::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--ink-3) 60%, transparent); background-clip: content-box; }

/* ---------- app frame ---------- */
#app {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr) 0px;
  grid-template-rows: 52px minmax(0, 1fr);
  height: 100vh;
  grid-template-areas: "top top top" "rail main pane";
}
#app.pane-open { grid-template-columns: 232px minmax(0, 1fr) minmax(380px, 46%); }
#app.rail-hidden { grid-template-columns: 0px minmax(0, 1fr) 0px; }
#app.rail-hidden.pane-open { grid-template-columns: 0px minmax(0, 1fr) minmax(380px, 46%); }

/* ---------- topbar ---------- */
.topbar {
  grid-area: top;
  display: flex; align-items: center; gap: 12px;
  padding: 0 12px 0 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  z-index: 30;
}
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand-mark {
  display: grid; place-items: center;
  width: 26px; height: 26px; border-radius: 8px; flex: none;
  background:
    radial-gradient(120% 120% at 20% 0%, color-mix(in srgb, var(--accent) 70%, white) 0%, var(--accent) 60%, color-mix(in srgb, var(--accent) 70%, black) 100%);
  color: #fff; display: grid; place-items: center;
  font-weight: 700; font-size: 12.5px; letter-spacing: -.02em;
  box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .18);
}
.brand-name { font-weight: 650; letter-spacing: -.015em; font-size: 15px; white-space: nowrap; }
.brand-sub { color: var(--ink-3); font-size: 11.5px; white-space: nowrap; }
.topbar-spacer { flex: 1; }

.search-wrap { position: relative; flex: 1; max-width: 460px; min-width: 120px; }
.search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
#global-search {
  width: 100%; height: 32px; padding: 0 74px 0 30px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  font-size: 13px;
}
#global-search:focus { background: var(--panel); border-color: var(--accent-line); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.search-wrap .kbd-hint { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); display: flex; gap: 3px; }

kbd {
  font-family: var(--font); font-size: 10.5px; line-height: 1;
  padding: 3px 5px; border-radius: 5px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink-3); box-shadow: 0 1px 0 var(--line);
  white-space: nowrap;
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 11px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  font-size: 12.5px; font-weight: 550; box-shadow: var(--shadow-1); white-space: nowrap;
}
.btn:hover { background: var(--panel-2); border-color: color-mix(in srgb, var(--ink-3) 35%, var(--line)); }
.btn:active { transform: translateY(.5px); }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, black); }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--ink-2); }
.btn.ghost:hover { background: color-mix(in srgb, var(--ink-3) 12%, transparent); color: var(--ink); }
.btn.sm { height: 26px; padding: 0 8px; font-size: 12px; border-radius: 6px; }
.btn.icon { width: 30px; padding: 0; }
.btn.icon.sm { width: 26px; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, var(--line)); }
.btn.danger:hover { background: color-mix(in srgb, var(--bad) 10%, transparent); }
.btn.copy-btn { min-width: 74px; }
.btn.copy-btn.done { background: var(--ok); border-color: transparent; color: #fff; }
.btn[disabled] { opacity: .5; pointer-events: none; }

/* ---------- rail ---------- */
.rail {
  grid-area: rail; background: var(--rail); border-right: 1px solid var(--line);
  overflow-y: auto; padding: 12px 10px 40px; min-width: 0;
  display: flex; flex-direction: column; gap: 16px;
}
.rail-sec-title {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--ink-3); font-weight: 700; padding: 0 8px 6px;
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
}
.rail-list { display: flex; flex-direction: column; gap: 1px; }
.rail-item {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 6px 8px; border-radius: 7px; color: var(--ink-2); font-size: 13px;
  text-align: left; min-width: 0;
}
.rail-item:hover { background: color-mix(in srgb, var(--ink-3) 13%, transparent); color: var(--ink); }
.rail-item.active { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-1); border: 1px solid var(--line); }
.rail-item .dot { width: 7px; height: 7px; border-radius: 99px; flex: none; background: var(--ink-3); }
.rail-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-item .count { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.rail-empty { font-size: 12px; color: var(--ink-3); padding: 2px 8px 6px; line-height: 1.45; }

.rail-foot { margin-top: auto; padding: 8px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.save-state { font-size: 11px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.save-state i { width: 6px; height: 6px; border-radius: 99px; background: var(--ok); display: inline-block; }
.save-state.dirty i { background: var(--warn); }

/* ---------- main ---------- */
.main { grid-area: main; overflow-y: auto; padding: 14px 16px 60px; min-width: 0; position: relative; }
.main-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.main-title { font-size: 19px; font-weight: 680; letter-spacing: -.02em; line-height: 1.2; }
.main-desc { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; max-width: 62ch; }
.main-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }

.toolbar {
  position: sticky; top: -14px; z-index: 12;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 9px 10px; margin: 10px -4px 12px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px) saturate(120%);
  border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-1);
}
.toolbar .sep { width: 1px; height: 20px; background: var(--line); }
.toolbar .grow { flex: 1; }
.field-inline { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-3); }
select.mini, input.mini {
  height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel);
  padding: 0 6px; font-size: 12.5px; color: var(--ink);
}
.tagchips { display: flex; gap: 5px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 23px; padding: 0 8px;
  border-radius: 99px; border: 1px solid var(--line); background: var(--panel);
  font-size: 11.5px; color: var(--ink-2); white-space: nowrap;
}
.chip:hover { border-color: var(--accent-line); color: var(--ink); }
.chip.on { background: var(--accent); border-color: transparent; color: #fff; }
.chip.on svg { color: #fff; }

/* ---------- template cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(292px, 1fr)); gap: var(--row-gap); }
.list { display: flex; flex-direction: column; gap: 7px; }
.list .card { grid-column: 1 / -1; }

.card {
  position: relative; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: var(--card-pad); display: flex; flex-direction: column; gap: 8px;
  box-shadow: var(--shadow-1); cursor: pointer; min-width: 0;
}
.card:hover { border-color: color-mix(in srgb, var(--ink-3) 32%, var(--line)); box-shadow: var(--shadow-2); }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-1); }
.card.drag-over { border-color: var(--accent); border-style: dashed; background: var(--accent-soft); }
.card-top { display: flex; align-items: flex-start; gap: 8px; }
.card-title { font-size: 13.5px; font-weight: 620; letter-spacing: -.01em; line-height: 1.35; flex: 1; min-width: 0; }
.card-cat {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700;
  color: var(--ink-3); display: flex; align-items: center; gap: 5px; flex: none;
}
.card-subj {
  font-size: 12px; color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--line-2);
  border-left: 2px solid var(--accent-line); border-radius: 6px; padding: 4px 7px; line-height: 1.4;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-subj::before { content: "Re: "; color: var(--ink-3); font-weight: 600; }
.subj-row .subj {
  font-size: 13.5px; font-weight: 550; background: var(--panel-2); border: 1px solid var(--line-2);
  border-left: 2px solid var(--accent); border-radius: 6px; padding: 8px 10px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
}
.subj-row .subj::before { content: "Subject: "; color: var(--ink-3); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
.card-snip {
  font-size: 12.5px; line-height: 1.55; color: var(--ink-2);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  white-space: pre-wrap; word-break: break-word;
}
.list .card-subj {
  font-size: 12px; color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--line-2);
  border-left: 2px solid var(--accent-line); border-radius: 6px; padding: 4px 7px; line-height: 1.4;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-subj::before { content: "Re: "; color: var(--ink-3); font-weight: 600; }
.subj-row .subj {
  font-size: 13.5px; font-weight: 550; background: var(--panel-2); border: 1px solid var(--line-2);
  border-left: 2px solid var(--accent); border-radius: 6px; padding: 8px 10px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
}
.subj-row .subj::before { content: "Subject: "; color: var(--ink-3); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
.card-snip { -webkit-line-clamp: 2; }
.card-snip mark, .card-title mark, .pane mark { background: color-mix(in srgb, var(--warn) 34%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.card-foot { display: flex; align-items: center; gap: 6px; margin-top: auto; padding-top: 2px; }
.card-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-3); min-width: 0; flex: 1; }
.card-meta .tag { color: var(--ink-3); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 5px; font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; }
.card-btns { display: flex; gap: 5px; align-items: center; }
.star { color: var(--ink-3); }
.star.on { color: var(--warn); }
.star:hover { color: var(--warn); }
.varpill {
  font-size: 10.5px; font-family: var(--mono); color: var(--accent);
  background: var(--accent-soft); border-radius: 5px; padding: 1px 5px; white-space: nowrap;
}
.filepill { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 5px; }

/* phrase grid */
.phrase-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 7px; }
.phrase {
  display: flex; align-items: flex-start; gap: 8px; padding: 9px 10px;
  border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--panel);
  font-size: 12.5px; line-height: 1.5; cursor: pointer;
}
.phrase:hover { border-color: var(--accent-line); background: var(--panel-2); }
.phrase p { margin: 0; flex: 1; color: var(--ink-2); }
.phrase .copy-inline { opacity: 0; flex: none; }
.phrase:hover .copy-inline, .phrase:focus-within .copy-inline { opacity: 1; }

/* ---------- empty ---------- */
.empty {
  border: 1px dashed var(--line); border-radius: 14px; padding: 34px 22px; text-align: center;
  color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--panel-2);
}
.empty h3 { margin: 0; font-size: 15px; font-weight: 640; color: var(--ink); }
.empty p { margin: 0; font-size: 12.5px; max-width: 46ch; line-height: 1.6; }
.empty .row { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; }

/* ---------- preview pane ---------- */
.pane {
  grid-area: pane; background: var(--panel); border-left: 1px solid var(--line);
  display: none; flex-direction: column; min-width: 0; overflow: hidden;
}
#app.pane-open .pane { display: flex; }
.pane-head {
  display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 14px;
  border-bottom: 1px solid var(--line); min-height: 47px;
}
.pane-head .t { font-weight: 640; font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pane-body { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.pane-foot { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; gap: 7px; align-items: center; background: var(--panel-2); }
.pane-foot .hint { font-size: 11px; color: var(--ink-3); margin-left: auto; text-align: right; }

.prose {
  font-size: var(--fs-body); line-height: 1.68; white-space: pre-wrap; word-break: break-word;
  background: var(--panel-2); border: 1px solid var(--line-2); border-radius: var(--radius); padding: 13px 14px;
}
.prose .var { color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 3px; font-family: var(--mono); font-size: .93em; }
.prose.plain { background: transparent; border: 0; padding: 0; }
.pane-sec { display: flex; flex-direction: column; gap: 7px; }
.pane-sec > h4 {
  margin: 0; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-3); font-weight: 700; display: flex; align-items: center; gap: 6px;
}
.meta-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink-3); }

/* ---------- shelf / files ---------- */
.dropzone {
  border: 1.5px dashed var(--line); border-radius: 14px; padding: 26px; text-align: center;
  color: var(--ink-2); background: var(--panel-2); display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.dropzone.hot { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 9px; }
.file-card {
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
  overflow: hidden; display: flex; flex-direction: column;
}
.file-card:hover { border-color: var(--accent-line); }
.file-thumb { height: 92px; display: grid; place-items: center; background: var(--panel-2); color: var(--ink-3); position: relative; }
.file-thumb img { width: 100%; height: 100%; object-fit: cover; }
.file-thumb .ext { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.file-name { font-size: 12px; font-weight: 570; padding: 8px 9px 0; line-height: 1.35; word-break: break-word; }
.file-sub { font-size: 11px; color: var(--ink-3); padding: 2px 9px 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.file-btns { display: flex; gap: 5px; padding: 0 8px 8px; flex-wrap: wrap; }
.file-card[draggable="true"] { cursor: grab; }
.file-card[draggable="true"]:active { cursor: grabbing; }
.file-card.dragging { opacity: .45; transform: scale(.98); }

/* ---------- cases ---------- */
.table-wrap { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); box-shadow: var(--shadow-1); }
table.cases { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.cases th {
  text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3);
  padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel-2); font-weight: 700; white-space: nowrap;
}
table.cases td { padding: 8px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.cases tr:last-child td { border-bottom: 0; }
table.cases tr:hover td { background: var(--panel-2); }
table.cases tr.drag-over td { background: var(--accent-soft); }
select.status-pill {
  height: 24px; padding: 0 4px 0 8px; border-radius: 99px; cursor: pointer;
  font-family: inherit; -webkit-appearance: none; appearance: none;
}
.status-pill {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
  padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel-2); white-space: nowrap;
}
.status-pill[data-status="new"] { color: var(--info); border-color: color-mix(in srgb, var(--info) 30%, var(--line)); background: color-mix(in srgb, var(--info) 10%, transparent); }

}
.modal.narrow { width: min(480px, 100%); }
.modal.wide { width: min(1000px, 100%); }
.modal-head { padding: 13px 15px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }

}
textarea.txt { font-family: var(--mono); font-size: 12.8px; line-height: 1.6; resize: vertical; min-height: 220px; }

.help { font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }

.var-list { display: flex; gap: 5px; flex-wrap: wrap; }

.checkrow { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }

/* ---------- palette ---------- */
.palette { width: min(620px, 100%); align-self: start; margin-top: 8vh; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-3); overflow: hidden; }

.pres .ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--line); flex: none; color: var(--ink-2); }

  <div style="font-family:system-ui;padding:40px;max-width:52ch;margin:0 auto;line-height:1.6">
    <h1>OSR Desk needs JavaScript</h1>
    <p>It's a single HTML file with no server behind it — everything you type is stored in this browser. Turn JavaScript on, or open it in a normal browser window instead of an embedded preview.</p>

<script data-src="src/js/db.js">
/* =========================================================
   db.js — the local database.

   Everything the desk knows lives here: one IndexedDB per origin,
   split into real tables (templates, phrases, files, cases, …) with
   indexes, instead of one giant JSON string in localStorage.

   Why: localStorage gives a browser ~5 MB for ONE value, and the old
   design re-serialised the whole workspace on every keystroke. A pasted
   screenshot over ~1 MB could blow the quota and the library would then
   silently stop saving. IndexedDB gives hundreds of MB, per-record
   writes, indexed lookups, and real blob storage — with no server, no
   account, no dependencies, and no network.

   The rules this file must never break:
     · works from file:// AND http://
     · if IndexedDB is missing / blocked / full / locked by another tab,
       we degrade to store.js's localStorage path — the app must still
       boot, still save, and say so
     · a failed write must never lose the in-memory workspace
   ========================================================= */

const DB_NAME = 'osr-desk';
const DB_VERSION = 1;                        // bump to change the tables
const STATE_SCHEMA = 3;                      // shape of the records themselves
const LEGACY_VAULT_DB = 'osr-desk-files';    // the old blob-only database, absorbed on first run
const LS_KEY = 'osr.desk.state.v' + STATE_SCHEMA;
const LS_MIRROR = LS_KEY + '.mirror';

/**
 * Table map. `key` is the IDB keyPath, `idx` are secondary indexes.
 * A collection in the state object maps 1:1 to a table, so what you see in
 * DevTools (`await OSRDB.dump('templates')`) is literally the rows.
 */
const TABLES = {
  meta:       { key: 'key', idx: [] },
  settings:   { key: 'key', idx: [] },
  vars:       { key: 'key', idx: [] },
  categories: { key: 'id',  idx: [['order', 'number'], ['name', 'string']] },
  templates:  { key: 'id',  idx: [['category', 'string'], ['favorite', 'string'], ['usage', 'number'],
                                  ['updatedAt', 'string'], ['title', 'string'], ['tags', 'string', true]] },
  phrases:    { key: 'id',  idx: [['usage', 'number'], ['favorite', 'string']] },
  cases:      { key: 'id',  idx: [['status', 'string'], ['updatedAt', 'string']] },
  files:      { key: 'id',  idx: [['name', 'string'], ['kind', 'string'], ['at', 'string']] },
  activity:   { key: 'id',  idx: [['at', 'string'], ['kind', 'string'], ['ref', 'string']] },
  trash:      { key: 'id',  idx: [['at', 'string']] },
  blobs:      { key: 'id',  idx: [['mime', 'string'], ['at', 'string']] }
};

/** rows we keep per table — the DB can afford more history than the 5 MB blob could */
const LIMITS = { activity: 400, trash: 40 };

const ROW_TABLES = ['settings', 'vars', 'categories', 'templates', 'phrases', 'cases', 'files', 'activity', 'trash'];

const DB = (() => {
  let dbp = null;
  let db = null;
  let broken = false;
  let lastErr = '';
  let channel = null;
  const deviceId = 'dev_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);

  /* last-written JSON per table+id, so a flush only touches rows that changed */
  let written = Object.create(null);

  const ok = () => !broken && !!db;

  function giveUp(why) {
    broken = true;
    lastErr = String((why && why.message) || why || 'unknown');
    if (typeof console !== 'undefined' && console.warn) console.warn('[osr-db] using the localStorage fallback —', lastErr);
    return null;
  }

  function canTry() {
    try {
      if (typeof indexedDB === 'undefined' || !indexedDB || typeof indexedDB.open !== 'function') return false;
      void indexedDB.open;      // some hardened browsers throw on the getter
      return true;
    } catch (e) { return false; }
  }

  function open() {
    if (broken) return Promise.resolve(null);
    if (dbp) return dbp;
    if (!canTry()) return Promise.resolve(giveUp('this browser has no IndexedDB'));

    dbp = new Promise((res) => {
      let done = false;
      const finish = (v) => { if (done) return; done = true; res(v); };
      let req;
      try { req = indexedDB.open(DB_NAME, DB_VERSION); }
      catch (e) { finish(giveUp(e)); return; }

      // another window on an older version can block an upgrade forever
      const guard = setTimeout(() => finish(giveUp('opening the database timed out (another window holds it open)')), 6000);

      req.onupgradeneeded = (ev) => {
        try {
          const d = req.result;
          const txr = req.transaction;
          for (const [name, spec] of Object.entries(TABLES)) {
            const store = d.objectStoreNames.contains(name) ? txr.objectStore(name) : d.createObjectStore(name, { keyPath: spec.key });
            for (const [field, , multi] of spec.idx) {
              const iname = 'by_' + field;
              if (!store.indexNames.contains(iname)) store.createIndex(iname, field, { unique: false, multiEntry: !!multi });
            }
          }
          txr.objectStore('meta').put({
            key: 'app', dbVersion: DB_VERSION, stateSchema: STATE_SCHEMA,
            createdAt: new Date().toISOString(), upgradedAt: new Date().toISOString()
          });
        } catch (e) { clearTimeout(guard); finish(giveUp(e)); }
      };
      req.onsuccess = () => {
        clearTimeout(guard);
        db = req.result;
        try { db.onversionchange = () => { try { db.close(); } catch (e) {} db = null; broken = true; }; } catch (e) {}
        try { db.onclose = () => { if (!broken) { db = null; giveUp('the database connection closed'); } }; } catch (e) {}
        finish(db);
      };
      req.onerror = () => { clearTimeout(guard); finish(giveUp(req.error || new Error('open failed'))); };
      req.onblocked = () => { clearTimeout(guard); finish(giveUp('blocked by another window that has the desk open')); };
    });
    return dbp;
  }

  /* ---------- transaction helpers ---------- */

  /** one transaction; `fn(getStore)` queues work, the promise settles on complete */
  function tx(names, mode, fn) {
    if (!ok()) return Promise.reject(new Error('no-db'));
    return new Promise((res, rej) => {
      let t;
      try { t = db.transaction(names, mode); } catch (e) { rej(e); return; }
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error || new Error('database error'));
      t.onabort = () => rej(t.error || new Error('write aborted (storage full?)'));
      try { fn((name) => t.objectStore(name)); }
      catch (e) { try { t.abort(); } catch (e2) {} rej(e); }
    });
  }

  /** read helper that also works when the tx helper's fire-and-forget would not */
  function readRows(name, want) {
    if (!ok()) return Promise.resolve(null);
    return new Promise((res) => {
      try {
        const t = db.transaction(name, 'readonly');
        const store = t.objectStore(name);
        const r = want === 'keys' ? store.getAllKeys() : store.getAll();
        r.onsuccess = () => res(r.result == null ? [] : r.result);
        r.onerror = () => res(null);
        t.onabort = () => res(null);
      } catch (e) { res(null); }
    });
  }

  function readRow(storeName, key) {
    if (!ok()) return Promise.resolve(null);
    return new Promise((res) => {
      try {
        const t = db.transaction(storeName, 'readonly');
        const r = t.objectStore(storeName).get(key);
        r.onsuccess = () => res(r.result == null ? null : r.result);
        r.onerror = () => res(null);
        t.onabort = () => res(null);
      } catch (e) { res(null); }
    });
  }

  /* ---------- reading the workspace ---------- */

  /** every table except blobs, in one readonly transaction */
  function readAll() {
    if (!ok()) return Promise.reject(new Error('no-db'));
    const out = { meta: [] };
    for (const n of ROW_TABLES) out[n] = [];
    return tx(['meta'].concat(ROW_TABLES), 'readonly', (s) => {
      const collect = (name, store) => {
        const r = store.getAll();
        r.onsuccess = () => { out[name] = r.result || []; };
      };
      collect('meta', s('meta'));
      for (const name of ROW_TABLES) collect(name, s(name));
    }).then(() => out, () => Promise.reject(new Error('read failed')));
  }

  function countAll() {
    if (!ok()) return Promise.resolve(null);
    const out = {};
    const names = Object.keys(TABLES);
    return tx(names, 'readonly', (s) => {
      for (const name of names) {
        const r = s(name).count();
        r.onsuccess = () => { out[name] = r.result; };
      }
    }).then(() => out, () => null);
  }

  /* ---------- writing ---------- */

  /** the state object → rows for one table */
  function rowsFor(name, state) {
    switch (name) {
      case 'settings': return state.settings ? [Object.assign({ key: 'settings' }, state.settings)] : [];
      case 'vars': return Object.keys(state.vars || {}).map((k) => ({ key: k, value: state.vars[k] }));
      case 'categories': return (state.categories || []).map((c, i) => Object.assign({}, c, { order: Number.isFinite(c.order) ? c.order : i }));
      case 'activity': return (state.activity || []).slice(0, LIMITS.activity);
      case 'trash': return (state.trash || []).slice(0, LIMITS.trash);
      default: return state[name] || [];
    }
  }

  const hash = (row) => { try { return JSON.stringify(row); } catch (e) { return String(row); } };

  /**
   * Diff the in-memory workspace against what we last wrote, and only touch
   * rows that changed. Editing one template rewrites one row — not the whole
   * library. Resolves { touched, bytes }; rejects if the transaction failed
   * (the caller then keeps the in-memory state and retries on the next save).
   */
  function flushState(state) {
    if (!ok()) return Promise.reject(new Error('no-db'));
    const jobs = [];
    const nextWritten = Object.create(null);
    for (const name of ROW_TABLES) {
      const keyPath = TABLES[name].key;
      const want = rowsFor(name, state);
      const prev = written[name] || {};
      const seen = Object.create(null);
      const next = Object.create(null);
      const puts = [];
      for (const row of want) {
        const id = row[keyPath];
        seen[id] = 1;
        const json = hash(row);
        next[id] = json;
        if (prev[id] === json) continue;
        puts.push(row);
      }
      const dels = Object.keys(prev).filter((id) => !seen[id]);
      if (puts.length || dels.length) jobs.push({ name, puts, dels });
      nextWritten[name] = next;
    }
    if (!jobs.length) return Promise.resolve({ engine: 'idb', touched: 0, bytes: 0 });

    let touched = 0, bytes = 0;
    const p = tx(['meta'].concat(ROW_TABLES), 'readwrite', (s) => {
      for (const job of jobs) {
        const store = s(job.name);
        for (const row of job.puts) { touched++; bytes += hash(row).length; store.put(row); }
        for (const id of job.dels) { touched++; store.delete(id); }
      }
      s('meta').put({ key: 'saved', at: new Date().toISOString(), device: deviceId, touched, bytes });
    });
    // publish the new snapshot only once the write has actually landed
    return p.then(
      () => { written = nextWritten; return { engine: 'idb', touched, bytes }; },
      (err) => { throw err; }
    );
  }

  /** rewrite every row, ignoring the diff cache — first save, import, repair */
  function writeAll(state) {
    if (!ok()) return Promise.reject(new Error('no-db'));
    const rows = {};
    for (const name of ROW_TABLES) rows[name] = rowsFor(name, state);
    let n = 0;
    return tx(['meta'].concat(ROW_TABLES), 'readwrite', (s) => {
      for (const name of ROW_TABLES) {
        const store = s(name);
        store.clear();
        for (const row of rows[name]) { n++; store.put(row); }
      }
      s('meta').put({ key: 'saved', at: new Date().toISOString(), device: deviceId, touched: n, bytes: 0 });
    }).then(() => {
      const next = Object.create(null);
      for (const name of ROW_TABLES) {
        const per = Object.create(null);
        for (const row of rows[name]) per[row[TABLES[name].key]] = hash(row);
        next[name] = per;
      }
      written = next;
      return { engine: 'idb', rows: n };
    });
  }

  /* ---------- single-row helpers (delete / undo / import) ---------- */
  function put(name, row) {
    if (!ok()) return Promise.reject(new Error('no-db'));
    return tx([name], 'readwrite', (s) => { s(name).put(row); }).then(() => {
      const per = written[name] || (written[name] = Object.create(null));
      per[row[TABLES[name].key]] = hash(row);
    });
  }
  function remove(name, id) {
    if (!ok()) return Promise.reject(new Error('no-db'));
    return tx([name], 'readwrite', (s) => { s(name).delete(id); }).then(() => {
      if (written[name]) delete written[name][id];
    });
  }
  function clear(name) {
    if (!ok()) return Promise.reject(new Error('no-db'));
    return tx([name], 'readwrite', (s) => { s(name).clear(); }).then(() => {
      if (written[name]) written[name] = Object.create(null);
    });
  }

  /* ---------- meta ---------- */
  function setMeta(key, value) {
    if (!ok()) return Promise.resolve(false);
    return tx(['meta'], 'readwrite', (s) => { s('meta').put(Object.assign({ key }, value || {})); }).then(() => true, () => false);
  }
  function getMeta(key) { return readRow('meta', key); }

  /* ---------- the blob table: files, screenshots, attachments ---------- */

  /*
   * Blobs are stored as { id, name, mime, size, at, bytes } where `bytes` is an
   * ArrayBuffer. ArrayBuffers clone cleanly through IDB everywhere (Blobs do not
   * in every webview), and the size is on the row so stats don't need the bytes.
   */
  async function blobPut(fileId, blob, meta) {
    if (!ok()) throw new Error('no-db');
    const bytes = await toBytes(blob);
    const size = bytes.byteLength;
    const row = Object.assign({
      id: fileId,
      name: (blob && blob.name) || (meta && meta.name) || '',
      mime: (blob && blob.type) || (meta && meta.mime) || 'application/octet-stream',
      size,
      at: new Date().toISOString()
    }, meta && meta.thumbOf ? { thumbOf: meta.thumbOf } : null, { bytes });
    await tx(['blobs'], 'readwrite', (s) => { s('blobs').put(row); });
    return { stored: 'idb', size };
  }

  async function blobGet(fileId) {
    const row = await readRow('blobs', fileId);
    if (!row) return null;
    return fromBytes(row.bytes, row.mime);
  }

  /** the row itself (no bytes) — for stats and verification */
  function blobRow(fileId) {
    return readRow('blobs', fileId).then((row) => {
      if (!row) return null;
      const { bytes, ...rest } = row;
      return rest;
    });
  }

  function blobDel(fileId) {
    if (!ok()) return Promise.resolve(false);
    return tx(['blobs'], 'readwrite', (s) => { s('blobs').delete(fileId); }).then(() => true, () => false);
  }

  function blobIds() { return readRows('blobs', 'keys'); }

  async function blobBytesFor(fileId) {
    const row = await readRow('blobs', fileId);
    return row ? row.bytes : null;
  }

  function toBytes(blob) {
    if (blob == null) return Promise.resolve(new Uint8Array(0).buffer);
    if (typeof blob === 'string') return Promise.resolve(new TextEncoder().encode(blob).buffer);
    if (typeof ArrayBuffer !== 'undefined' && blob instanceof ArrayBuffer) return Promise.resolve(blob);
    if (typeof Uint8Array !== 'undefined' && blob instanceof Uint8Array) return Promise.resolve(blob.buffer);
    if (typeof blob.arrayBuffer === 'function') return blob.arrayBuffer().then((b) => b, () => readAsDataURLBytes(blob));
    return readAsDataURLBytes(blob);
  }
  function readAsDataURLBytes(blob) {
    return new Promise((res) => {
      try {
        const fr = new FileReader();
        fr.onload = () => {
          const s = String(fr.result || '');
          const i = s.indexOf(',');
          try { res(base64ToBytes(i >= 0 ? s.slice(i + 1) : s)); } catch (e) { res(new Uint8Array(0).buffer); }
        };
        fr.onerror = () => res(new Uint8Array(0).buffer);
        fr.readAsDataURL(blob);
      } catch (e) { res(new Uint8Array(0).buffer); }
    });
  }
  function base64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out.buffer;
  }
  function fromBytes(bytes, mime) {
    if (typeof Blob !== 'undefined') { try { return new Blob([bytes], { type: mime || '' }); } catch (e) {} }
    return bytes;
  }

  /* ---------- absorb the old blob-only database, once ---------- */
  async function absorbLegacyVault() {
    if (!ok()) return 0;
    let moved = 0;
    let old = null;
    try {
      // opening a database that does not exist would CREATE it, so look first
      if (indexedDB.databases) {
        const list = await indexedDB.databases().catch(() => null);
        if (list && !list.some((d) => d.name === LEGACY_VAULT_DB)) return 0;
      }
      old = await new Promise((res) => {
        let r;
        try { r = indexedDB.open(LEGACY_VAULT_DB); } catch (e) { res(null); return; }
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
        r.onblocked = () => res(null);
      });
      if (!old) return 0;
      if (!old.objectStoreNames.contains('blobs')) { old.close(); return 0; }
      // the old vault stored raw Blobs under out-of-line keys, so we need cursors
      const pairs = await new Promise((res) => {
        try {
          const t = old.transaction('blobs', 'readonly');
          const rows = [];
          const cur = t.objectStore('blobs').openCursor();
          cur.onsuccess = () => {
            const c = cur.result;
            if (c) { rows.push({ key: c.key, value: c.value }); c.continue(); } else res(rows);
          };
          cur.onerror = () => res([]);
        } catch (e) { res([]); }
      });
      const have = new Set((await blobIds()) || []);
      const keep = [];
      for (const p of pairs) {
        if (p.key == null || have.has(p.key)) continue;
        try {
          const bytes = await toBytes(p.value);
          keep.push({
            id: p.key, name: '', mime: (p.value && p.value.type) || 'application/octet-stream',
            size: bytes.byteLength, at: new Date().toISOString(), legacy: true, bytes
          });
        } catch (e) { /* skip an unreadable row rather than failing the boot */ }
      }
      if (keep.length) {
        await tx(['blobs'], 'readwrite', (s) => { for (const row of keep) s('blobs').put(row); });
        moved = keep.length;
        old.close();
        try { indexedDB.deleteDatabase(LEGACY_VAULT_DB); } catch (e) {}
      } else old.close();
    } catch (e) {
      try { if (old && old.close) old.close(); } catch (e2) {}
    }
    if (moved) setMeta('absorbed', { at: new Date().toISOString(), blobs: moved });
    return moved;
  }

  /* ---------- two windows, one database ---------- */
  function openChannel(onOther) {
    if (typeof BroadcastChannel === 'undefined') return;
    if (channel) return;
    try {
      channel = new BroadcastChannel('osr-desk');
      channel.onmessage = (ev) => {
        const d = ev && ev.data;
        if (!d || d.device === deviceId) return;
        try { onOther(d); } catch (e) { /* a stale window must not break this one */ }
      };
    } catch (e) { channel = null; }
  }
  function announce(kind, info) {
    if (!channel) return;
    try { channel.postMessage(Object.assign({ device: deviceId, kind, at: Date.now() }, info || {})); } catch (e) {}
  }

  /* ---------- health: the things a human needs to fix this ---------- */

  async function stats(state) {
    const counts = await countAll();
    let est = null;
    try { if (navigator.storage && navigator.storage.estimate) est = await navigator.storage.estimate(); } catch (e) { est = null; }
    const tables = {};
    for (const name of Object.keys(TABLES)) {
      const live = counts && counts[name] != null ? counts[name] : null;
      if (live != null) { tables[name] = live; continue; }
      if (name === 'blobs' || name === 'meta') { tables[name] = null; continue; }
      if (name === 'settings') { tables[name] = state && state.settings ? 1 : 0; continue; }
      if (name === 'vars') { tables[name] = state ? Object.keys(state.vars || {}).length : 0; continue; }
      tables[name] = state && Array.isArray(state[name]) ? state[name].length : 0;
    }
    let mirrorBytes = 0;
    try { mirrorBytes = (localStorage.getItem(LS_MIRROR) || '').length; } catch (e) {}
    return {
      engine: DB.engine,
      available: ok(),
      db: DB_NAME,
      dbVersion: DB_VERSION,
      stateSchema: STATE_SCHEMA,
      device: deviceId,
      error: lastErr || null,
      tables,
      usage: est ? { usage: est.usage || 0, quota: est.quota || 0 } : null,
      lastSavedAt: savedAt(),
      mirrorBytes
    };
  }

  let savedAtCache = null;
  function savedAt() { return savedAtCache; }
  function noteSaved(at) { savedAtCache = at; }

  /** a write failed mid-session: remember why, for Settings + diagnostics */
  function noteWriteError(err) {
    lastErr = 'write refused: ' + String((err && err.message) || err || 'unknown');
    if (typeof console !== 'undefined' && console.warn) console.warn('[osr-db]', lastErr);
    return lastErr;
  }

  /**
   * Verify memory against the database: row counts match, every file that
   * claims to be stored really has bytes, no orphaned blobs, no dangling
   * links. Returns { ok, problems: [] }.
   */
  async function verify(state) {
    const problems = [];
    if (lastErr && ok()) problems.unshift('the last write was refused — ' + lastErr);
    if (!ok()) {
      return { ok: false, engine: DB.engine, problems: ['no database here — the desk is running on the localStorage mirror (' + (lastErr || 'no IndexedDB') + ')'] };
    }
    const counts = await countAll();
    for (const name of ROW_TABLES) {
      if (name === 'settings' || name === 'vars') continue;
      const want = (state[name] || []).length;
      const have = counts ? counts[name] : null;
      if (have != null && have !== want) problems.push(name + ': ' + want + ' in memory vs ' + have + ' in the database');
    }
    const ids = await blobIds();
    const fileRows = (state.files || []).filter((f) => f.kind === 'file' && !f.missing);
    if (ids) {
      const got = new Set(ids);
      for (const f of fileRows) if (!got.has(f.id)) problems.push('“' + f.name + '” has no bytes in the database');
      const used = new Set(fileRows.map((f) => f.id));
      for (const id of got) if (!used.has(id)) problems.push('an orphan blob (' + id + ') is taking space with no file using it');
    }
    const known = new Set((state.files || []).map((f) => f.id));
    for (const t of (state.templates || [])) {
      for (const fid of (t.fileIds || [])) if (!known.has(fid)) problems.push('“' + t.title + '” points at a file that no longer exists');
    }
    for (const c of (state.categories || [])) {
      if (!Number.isFinite(c.order)) problems.push('category “' + c.name + '” has no sort order');
    }
    for (const t of (state.templates || [])) {
      if (!t.category || !(state.categories || []).some((c) => c.id === t.category)) problems.push('“' + t.title + '” has no category');
    }
    return { ok: !problems.length, problems: problems.slice(0, 40), extra: problems.length - 40, engine: DB.engine, counts };
  }

  /** rewrite every row from memory and garbage-collect blobs nothing points at */
  async function repair(state) {
    const before = await countAll();
    const r = await writeAll(state);
    let dropped = 0;
    const ids = await blobIds();
    if (ids) {
      const keep = new Set((state.files || []).filter((f) => f.kind === 'file' || f.thumb).map((f) => f.id));
      const dead = ids.filter((i) => !keep.has(i));
      dropped = dead.length;
      if (dead.length) await tx(['blobs'], 'readwrite', (s) => { dead.forEach((i) => s('blobs').delete(i)); });
    }
    await setMeta('repair', Object.assign({ at: new Date().toISOString(), before }, before ? {} : {}));
    return { engine: DB.engine, rows: r.rows, droppedBlobs: dropped };
  }

  /** the JSON to paste into a chat / issue when the desk is misbehaving */
  function diagnostics(state) {
    const s = state || {};
    let lsBytes = -1, blocked = false;
    try { lsBytes = (localStorage.getItem(LS_KEY) || '').length; } catch (e) { blocked = true; }
    return {
      product: 'OSR Desk',
      at: new Date().toISOString(),
      engine: DB.engine,
      db: DB_NAME,
      dbVersion: DB_VERSION,
      stateSchema: STATE_SCHEMA,
      device: deviceId,
      error: lastErr || null,
      counts: {
        templates: (s.templates || []).length,
        phrases: (s.phrases || []).length,
        categories: (s.categories || []).length,
        files: (s.files || []).length,
        storedFiles: (s.files || []).filter((f) => f.stored).length,
        shortcutFiles: (s.files || []).filter((f) => f.kind === 'shortcut' || f.missing).length,
        cases: (s.cases || []).length,
        openCases: (s.cases || []).filter((c) => c.status !== 'resolved').length,
        activity: (s.activity || []).length,
        vars: Object.keys(s.vars || {}).length,
        trash: (s.trash || []).length
      },
      localStorageBytes: lsBytes,
      storageBlocked: blocked,
      origin: typeof location !== 'undefined' ? (location.origin === 'null' ? 'file://' : location.origin) : 'none',
      ua: typeof navigator !== 'undefined' ? String(navigator.userAgent).slice(0, 160) : ''
    };
  }

  /** seed the diff cache from a freshly hydrated state so boot rewrites nothing */
  function prime(state) {
    if (!state) return;
    const next = Object.create(null);
    for (const name of ROW_TABLES) {
      const per = Object.create(null);
      for (const row of rowsFor(name, state)) per[row[TABLES[name].key]] = hash(row);
      next[name] = per;
    }
    written = next;
  }

  return {
    get engine() { return broken ? 'kv' : (db ? 'idb' : 'opening'); },
    get available() { return ok(); },
    get broken() { return broken; },
    get lastError() { return lastErr; },
    get deviceId() { return deviceId; },
    get name() { return DB_NAME; },
    get key() { return LS_KEY; },
    get mirrorKey() { return LS_MIRROR; },
    get tables() { return TABLES; },
    get rowTables() { return ROW_TABLES; },
    get limits() { return LIMITS; },
    get lastSavedAt() { return savedAt(); },
    open, readAll, countAll, flushState, writeAll, put, remove, clear, prime,
    setMeta, getMeta, noteSaved, noteWriteError,
    blobPut, blobGet, blobDel, blobIds, blobRow, blobBytesFor,
    absorbLegacyVault, openChannel, announce,
    stats, verify, repair, diagnostics,
    /** every table, including blobs — Settings → Wipe uses this */
    async wipeAll() {
      if (!ok()) return false;
      written = Object.create(null);
      const names = Object.keys(TABLES);
      await tx(names, 'readwrite', (s) => { for (const n of names) s(n).clear(); });
      return true;
    }
  };
})();

/**
 * Console + Settings API. It exists so the data can be poked at directly,
 * without DevTools archaeology in an IndexedDB viewer:
 *   await OSRDB.dump('templates')
 *   await OSRDB.stats()
 *   await OSRDB.verify()
 *   await OSRDB.sql("SELECT title, usage FROM templates ORDER BY usage DESC LIMIT 5")
 */
window.OSRDB = {
  get engine() { return DB.engine; },
  tables() { return Object.keys(TABLES); },
  stats() { return DB.stats(typeof Store !== 'undefined' ? Store.s : null); },
  async dump(table) {
    const all = await DB.readAll();
    if (!table) return all;
    if (all[table]) return all[table];
    if (table === 'blobs') return (await DB.countAll()) ? (await DB.blobIds() || []).map((id) => ({ id })) : [];
    throw new Error('no such table: ' + table + ' · tables: ' + Object.keys(all).concat('blobs').join(', '));
  },
  blobs() { return DB.blobIds(); },
  verify() { return DB.verify(Store.s); },
  async repair() { const r = await DB.repair(Store.s); Store.refresh('data'); return r; },
  async diagnostics() { return JSON.stringify(DB.diagnostics(Store.s), null, 2); },
  async copyDiagnostics() {
    const text = await this.diagnostics();
    try { await navigator.clipboard.writeText(text); return 'copied'; }
    catch (e) { console.log(text); return 'logged'; }
  },
  wipe() { return DB.wipeAll(); },
  /** a SQL view over the tables, read-only, for people who think in SQL */
  sql(query) {
    return DB.readAll().then((all) => runSQL(String(query || ''), all));
  }
};

/* ---------- a small SELECT-only SQL subset for OSRDB.sql() ---------- */
function runSQL(q, data) {
  const text = String(q || '').trim().replace(/;+\s*$/, '');
  const m = /^select\s+([\s\S]+?)\s+from\s+(\w+)(?:\s+where\s+([\s\S]+?))?(?:\s+order\s+by\s+(\w+)(\s+(?:asc|desc))?)?(?:\s+limit\s+(\d+))?$/i.exec(text);
  if (!m) throw new Error('only “SELECT cols FROM table [WHERE col op value] [ORDER BY col [desc]] [LIMIT n]” is supported — and it never writes');
  const table = m[2];
  if (!(table in data)) throw new Error('no such table: ' + table + ' · tables: ' + Object.keys(data).concat('blobs').join(', '));
  let out = (data[table] || []).map((r) => Object.assign({}, r));
  const cols = m[1].trim().split(',').map((c) => c.trim()).filter(Boolean);
  const selAll = cols.length === 1 && cols[0] === '*';

  if (m[3]) {
    const c = /^(\w+)\s*(=|!=|<>|>=|<=|>|<|like)\s*([\s\S]+)$/i.exec(m[3].trim());
    if (!c) throw new Error('WHERE takes one comparison, e.g. usage > 3 · favorite = 1 · title LIKE refund');
    const [, field, opRaw, rawVal] = c;
    const op = opRaw.toLowerCase();
    const val = rawVal.trim().replace(/^['"]|['"]$/g, '');
    const num = /^-?\d+(\.\d+)?$/.test(val) ? Number(val) : null;
    out = out.filter((r) => {
      const a = r[field];
      if (op === 'like') return String(a == null ? '' : a).toLowerCase().includes(val.replace(/%/g, '').toLowerCase());
      if (op === '=') return String(a) === String(val) || a === true && /^(1|true)$/i.test(val);
      if (op === '!=' || op === '<>') return String(a) !== String(val);
      if (num == null) return false;
      const x = Number(a);
      if (op === '>') return x > num;
      if (op === '<') return x < num;
      if (op === '>=') return x >= num;
      if (op === '<=') return x <= num;
      return true;
    });
  }
  if (m[4]) {
    const f = m[4], desc = /desc/i.test(m[5] || '');
    out.sort((a, b) => {
      const x = a[f], y = b[f];
      const n = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x == null ? '' : x).localeCompare(String(y == null ? '' : y));
      return desc ? -n : n;
    });
  }
  if (m[6]) out = out.slice(0, Number(m[6]));
  if (selAll) return out;
  return out.map((r) => { const o = {}; for (const c of cols) o[c] = r[c]; return o; });
}

<script data-src="src/js/store.js">
/* =========================================================
   store.js — the in-memory workspace on top of db.js.

   State lives in memory (everything renders from it), and every change is
   written through to the local database as individual rows. If IndexedDB is
   unavailable we keep working on the localStorage mirror instead — older,
   smaller, and noisier about it, but never silent about losing your work.

   No build step, no deps. Works from file:// and http://.
   ========================================================= */

/* STATE_SCHEMA, LS_KEY and LS_MIRROR come from db.js (loaded first) */
const SCHEMA = STATE_SCHEMA;

const uid = (p = 'id') =>
  p + '_' + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 7);

const nowISO = () => new Date().toISOString();

/* ---------- key/value adapter (localStorage, else memory) ---------- */
const KV = (() => {
  let ok = true;
  const mem = new Map();
  try {
    const t = '__osr_probe__';
    localStorage.setItem(t, '1');
    localStorage.removeItem(t);
  } catch (e) {
    ok = false;
  }
  return {
    available: ok,
    get(k) {
      try { return ok ? localStorage.getItem(k) : mem.get(k) ?? null; } catch (e) { return mem.get(k) ?? null; }
    },
    set(k, v) {
      try { if (ok) localStorage.setItem(k, v); else mem.set(k, v); return true; }
      catch (e) {
        mem.set(k, v);
        return false;
      }
    },
    del(k) { try { ok ? localStorage.removeItem(k) : mem.delete(k); } catch (e) { mem.delete(k); } }
  };
})();

/* ---------- the file/blob store: DB.blobs, else data URLs in KV ---------- */
const Vault = (() => {
  return {
    /** 'idb' when bytes live in the database, 'kv' when they are inlined */
    get mode() { return DB.available ? 'idb' : 'kv'; },
    async put(id, blob, meta) {
      if (DB.available) {
        try {
          const res = await DB.blobPut(id, blob, meta);
          return { kind: 'idb', size: res.size };
        } catch (e) { /* full, closed, or refused — fall through to KV */ }
      }
      try {
        const dataUrl = await blobToDataURL(blob);
        const saved = KV.set('osr.file.' + id, dataUrl);
        return { kind: saved ? 'kv' : 'mem', dataUrl };
      } catch (e) { return { kind: 'mem' }; }
    },
    async get(id) {
      if (DB.available) {
        try {
          const blob = await DB.blobGet(id);
          if (blob) return blob;
        } catch (e) { /* fall through to KV */ }
      }
      const dv = KV.get('osr.file.' + id);
      if (!dv) return null;
      return dataURLToBlob(dv);
    },
    async del(id) {
      if (DB.available) { try { await DB.blobDel(id); } catch (e) { /* ignore */ } }
      KV.del('osr.file.' + id);
    },
    async exportOne(id) {
      const b = await this.get(id);
      return b ? await blobToDataURL(b) : null;
    },
    /** how much room is left, when the browser will say */
    async estimate() {
      try {
        if (navigator.storage && navigator.storage.estimate) return await navigator.storage.estimate();
      } catch (e) { /* ignore */ }
      return null;
    }
  };
})();

function dataURLToBlob(dataUrl) {
  const s = String(dataUrl || '');
  const i = s.indexOf(',');
  if (i < 0) return null;
  const meta = (s.slice(0, i).slice(5).split(';')[0] || 'application/octet-stream').trim() || 'application/octet-stream';
  try {
    const bin = atob(s.slice(i + 1));
    const out = new Uint8Array(bin.length);
    for (let n = 0; n < bin.length; n++) out[n] = bin.charCodeAt(n);
    return new Blob([out.buffer], { type: meta });
  } catch (e) { return null; }
}


const TEXTISH = /\.(txt|md|markdown|csv|tsv|log|json|jsonl|srt|vtt|html?|xml|ya?ml|ini|conf|rtf|eml|prn)$/i;
function looksTextual(f) {
  return /^text\//.test(f.mime || '') || TEXTISH.test(f.name || '');
}
function readBlobText(blob, limit) {
  const cut = (t) => (limit && t.length > limit ? t.slice(0, limit) : t);
  if (blob && typeof blob.text === 'function') return blob.text().then(cut);
  return new Promise((res, rej) => {
    try {
      const fr = new FileReader();
      fr.onload = () => res(cut(String(fr.result || '')));
      fr.onerror = () => rej(fr.error || new Error('read failed'));
      fr.readAsText(blob);
    } catch (e) { rej(e); }
  });
}

function blobToDataURL(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(blob);
  });
}

/* ---------- defaults ---------- */
function blankState() {
  return {
    schema: SCHEMA,
    installedAt: nowISO(),
    onboarded: false,
    settings: {
      theme: 'system',
      accent: '#2f6df6',
      density: 'comfortable',
      view: 'grid',
      sort: 'manual',
      yourName: '',
      yourRole: 'Online Support Representative',
      company: '',
      signature: '',
      appendSignature: false,
      plainCopy: true,
      fontSize: 14.5,
      rememberFill: true,
      hideChecklist: false
    },
    vars: {},               // remembered quick-fill values  key -> value
    categories: [],
    templates: [],
    phrases: [],
    files: [],              // metadata only; blob lives in Vault
    cases: [],
    activity: [],           // [{id, at, kind, ref}]
    trash: []               // soft-deleted items for undo
  };
}

/* ---------- store ---------- */
const Store = (() => {
  let state = null;
  const subs = new Set();
  let saveTimer = null;
  let dirty = false;
  let booted = false;

  function emit(kind) {
    subs.forEach((f) => { try { f(kind, state); } catch (e) { console.error(e); } });
  }

  function sanitize(s) {
    const base = blankState();
    if (!s || typeof s !== 'object') return base;
    const out = { ...base, ...s };
    out.settings = { ...base.settings, ...(s.settings || {}) };
    out.vars = s.vars && typeof s.vars === 'object' ? s.vars : {};
    for (const k of ['categories', 'templates', 'phrases', 'files', 'cases', 'activity', 'trash']) {
      if (!Array.isArray(out[k])) out[k] = [];
    }
    out.categories = out.categories.filter((c) => c && c.id && c.name);
    out.templates = out.templates.filter((t) => t && t.id && typeof t.body === 'string');
    out.phrases = out.phrases.filter((p) => p && p.id && p.text);
    out.templates.forEach((t) => {
      t.subject = typeof t.subject === 'string' ? t.subject : '';
      t.custom = !!t.custom; t.noSig = !!t.noSig;
      t.tags = Array.isArray(t.tags) ? t.tags : [];
      t.fileIds = Array.isArray(t.fileIds) ? t.fileIds : [];
      t.usage = Number(t.usage) || 0;
      t.favorite = !!t.favorite;
      t.order = Number.isFinite(t.order) ? t.order : 0;
      if (!t.category || !out.categories.some((c) => c.id === t.category)) t.category = out.categories[0]?.id || '';
    });
    out.phrases.forEach((p) => { p.usage = Number(p.usage) || 0; p.favorite = !!p.favorite; });
    out.files = out.files.filter((f) => f && f.id && f.name);
    out.cases.forEach((c) => { c.status = c.status || 'new'; c.history = Array.isArray(c.history) ? c.history : []; });
    out.schema = SCHEMA;
    return out;
  }

  /* ---------- reading ---------- */

  /** the old way: one JSON blob in localStorage (also our fallback path) */
  function loadFromKV() {
    let s = null;
    const raw = KV.get(LS_KEY);
    if (raw) { try { s = JSON.parse(raw); } catch (e) { s = null; } }
    if (!s || s.schema !== SCHEMA) {
      // migrate from older schema keys if present
      for (const older of ['osr.desk.state.v2', 'osr.desk.state.v1']) {
        const rr = KV.get(older);
        if (rr) { try { const p = JSON.parse(rr); if (p && p.templates) { s = p; break; } } catch (e) {} }
      }
    }
    return s ? sanitize(s) : null;
  }

  /** rows from the database → the shape the app renders from */
  function hydrate(rows) {
    const s = blankState();
    const app = (rows.meta || []).find((m) => m.key === 'app');
    const st = (rows.settings || []).find((r) => r.key === 'settings');
    if (st) {
      s.settings = sanitize({ settings: st }).settings;
      s.onboarded = st.onboarded !== false;
      if (st.installedAt) s.installedAt = st.installedAt;
    }
    for (const r of (rows.vars || [])) s.vars[r.key] = r.value;
    s.categories = (rows.categories || []).slice().sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));
    s.templates = rows.templates || [];
    s.phrases = rows.phrases || [];
    s.files = rows.files || [];        // each row already carries `stored` + `size`
    s.cases = rows.cases || [];
    s.activity = rows.activity || [];
    s.trash = rows.trash || [];
    if (app && app.createdAt) s.installedAt = app.createdAt;
    return sanitize(s);
  }

  function isEmpty(s) {
    return !(s && (s.templates.length || s.phrases.length || s.categories.length || s.cases.length || Object.keys(s.vars).length));
  }

  /**
   * Boot-time load. Prefers the database, migrates a localStorage workspace
   * into it once, and falls back to the blob if the DB can't be opened.
   */
  async function init() {
    if (booted) return state;
    booted = true;
    await DB.open();
    if (DB.available) {
      let rows = null;
      try { rows = await DB.readAll(); } catch (e) { rows = null; }
      const fromDb = rows ? hydrate(rows) : null;
      if (fromDb && !isEmpty(fromDb)) {
        state = fromDb;
        mode = 'idb';
        DB.prime(state);
        DB.absorbLegacyVault().then((moved) => { if (moved) emit('data'); }).catch(() => {});
        return state;
      }
      // fresh (or just-migrated) database: take whatever the old blob has
      const old = loadFromKV();
      const hasOld = !!old && !isEmpty(old);
      state = hasOld ? old : blankState();
      if (!hasOld) state.__fresh = true;
      mode = 'idb';
      try {
        await DB.writeAll(state);
        await DB.setMeta('app', { dbVersion: DB_VERSION, stateSchema: SCHEMA, createdAt: state.installedAt, migratedFrom: hasOld ? 'localStorage' : 'seed' });
        if (hasOld) {
          // keep the pre-migration blob where it is: it is the rollback copy
          KV.set(LS_MIRROR, JSON.stringify({ db: true, at: nowISO(), note: 'workspace now lives in IndexedDB; the v3 blob was left as the last pre-migration snapshot' }));
        }
        DB.prime(state);
        DB.absorbLegacyVault().catch(() => {});
      } catch (e) {
        mode = 'kv';     // write-through failed: behave like a browser without IDB
      }
      return state;
    }
    mode = 'kv';
    state = loadFromKV();
    if (!state) { state = blankState(); state.__fresh = true; }
    return state;
  }

  /** kept for the synchronous call sites (tests, reset paths) */
  function load() {
    if (!state) state = loadFromKV() || blankState();
    return state;
  }


  /* ---------- writing ---------- */

  let mode = 'idb';
  let failed = false;

  function mirrorKV() {
    // a tiny marker, not the workspace: the DB holds the truth
    try {
      KV.set(LS_MIRROR, JSON.stringify({ db: true, at: nowISO(), n: { t: state.templates.length, p: state.phrases.length, f: state.files.length } }));
    } catch (e) { /* nothing to do */ }
  }

  function persistKV() {
    let ok = KV.set(LS_KEY, JSON.stringify(state));
    if (!ok) {
      // storage was full: shed the heavy, re-creatable bits before giving up
      try {
        state.files.forEach((f) => { delete f.thumb; if ((f.snippet || '').length > 3000) f.snippet = f.snippet.slice(0, 3000); });
        state.activity = [];
        state.trash = [];
        ok = KV.set(LS_KEY, JSON.stringify(state));
        if (ok) Bus.toast('Browser storage was full — image previews were dropped to keep your text. Export a backup and clear some files off the shelf.', 'warn', 11000);
      } catch (e) { /* nothing more to try */ }
    }
    if (!ok) { failed = true; Bus.toast('Could not save to this browser. Export a backup (Settings → Export) before you close the tab.', 'bad', 14000); }
    else failed = false;
    return ok;
  }

  /** write the workspace through to wherever it belongs; resolves when durable */
  async function persist() {
    dirty = false;
    if (mode === 'idb' && DB.available) {
      try {
        const r = await DB.flushState(state);
        if (r.touched) { DB.noteSaved(nowISO()); mirrorKV(); }
        failed = false;
        emit('saved');
        return true;
      } catch (e) {
        // the database let us down mid-session: never lose the edit, fall back
        DB.noteWriteError(e);
        mode = 'kv';
        DB.announce('degraded', { error: String((e && e.message) || e) });
        Bus.toast('The browser database refused that write, so it is saved in the simpler local-storage mode instead. Settings → Where your data lives has the details.', 'warn', 12000);
        const ok = persistKV();
        emit('saved');
        return ok;
      }
    }
    const ok = persistKV();
    emit('saved');
    return ok;
  }

  function save() {
    dirty = true;
    emit('dirty');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 260);
  }

  return {
    get s() { return state; },
    get isDirty() { return dirty; },
    get mode() { return mode === 'idb' && DB.available ? 'idb' : 'kv'; },
    get lastSaveFailed() { return failed; },
    get engineName() { return this.mode === 'idb' ? 'IndexedDB (' + DB.name + ')' : 'localStorage (' + LS_KEY + ')'; },
    load,
    init,
    save,
    /** mutate with a function, then save + re-render */
    edit(mut, kind) {
      mut(state);
      save();
      emit(kind || 'data');
    },
    /** re-render only */
    refresh(kind) { emit(kind || 'ui'); },
    async flush() {
      clearTimeout(saveTimer);
      dirty = false;
      const ok = await persist();
      if (mode === 'idb' && DB.available) DB.announce('save', { n: state.templates.length });
      return ok;
    },
    subscribe(f) { subs.add(f); return () => subs.delete(f); },
    replaceAll(next) { state = sanitize(next); save(); emit('data'); },
    /** drop every row in every table, then re-seed from scratch */
    async resetAll() {
      KV.del(LS_KEY);
      KV.del(LS_MIRROR);
      clearTimeout(saveTimer);
      state = blankState();
      if (DB.available) {
        try { await DB.wipeAll(); } catch (e) { /* a DB that will not clear still leaves us consistent in memory */ }
      }
      dirty = false;
      if (mode === 'idb' && DB.available) { try { await DB.writeAll(state); DB.prime(state); } catch (e) { mode = 'kv'; } }
      else KV.set(LS_KEY, JSON.stringify(state));
      emit('data');
    },
    /**
     * Pull the tables back into memory. Another window wrote something and
     * poked us over BroadcastChannel — same database, two desks.
     */
    async reload() {
      if (!DB.available) return false;
      clearTimeout(saveTimer);
      try {
        const rows = await DB.readAll();
        state = hydrate(rows);
        dirty = false;
        DB.prime(state);
        emit('data');
        return true;
      } catch (e) { return false; }
    },
    /** full rewrite of every row — used after imports and by Settings → Verify */
    async rewrite() {
      if (!DB.available) return persistKV();
      const r = await DB.writeAll(state);
      DB.prime(state);
      DB.announce('save', { n: state.templates.length });
      return r;
    },
    async stats() { return DB.stats(state); },
    async verify() { return DB.verify(state); },
    async repair() {
      const r = DB.available ? await DB.repair(state) : { engine: 'kv', rows: 0, droppedBlobs: 0 };
      DB.prime(state);
      emit('data');
      return r;
    },
    diagnostics() { return DB.diagnostics(state); },
    blankState,
    uid,
    nowISO,
    Vault
  };
})();

/* ---------- lookups / helpers ---------- */
const Q = {
  category(id) { return Store.s.categories.find((c) => c.id === id) || null; },
  categoryName(id) { return Q.category(id)?.name || 'Unsorted'; },
  template(id) { return Store.s.templates.find((t) => t.id === id) || null; },
  file(id) { return Store.s.files.find((f) => f.id === id) || null; },
  phrase(id) { return Store.s.phrases.find((p) => p.id === id) || null; },
  templatesIn(catId) { return Store.s.templates.filter((t) => t.category === catId); },
  filesFor(t) { return (t.fileIds || []).map(Q.file).filter(Boolean); },
  allTags() {
    const m = new Map();
    Store.s.templates.forEach((t) => t.tags.forEach((tag) => m.set(tag, (m.get(tag) || 0) + 1)));
    return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  },
  orphans() {
    const used = new Set();
    Store.s.templates.forEach((t) => (t.fileIds || []).forEach((f) => used.add(f)));
    return Store.s.files.filter((f) => !used.has(f.id));
  }
};

const CAT_COLORS = ['#2f6df6', '#0f9d8a', '#d98314', '#c1362f', '#7b5cd6', '#2f8a3f', '#b0457a', '#4a5b6a'];

/* variable parsing */
const VAR_RE = /\{\{\s*([a-zA-Z0-9_. ]+)\s*\}\}/g;
function varsIn(text) {
  const out = [];
  let m;
  VAR_RE.lastIndex = 0;
  while ((m = VAR_RE.exec(String(text || '')))) {
    const k = m[1].trim();
    if (!out.includes(k)) out.push(k);
  }
  return out;
}
function autoValues() {
  const d = new Date();
  const s = Store.s.settings;
  const fmt = d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  const time = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  const h = d.getHours();
  return {
    date: fmt,
    today: fmt,
    time: time,
    greeting: h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening',
    day: fmt,
    agent_name: s.yourName || '',
    name: s.yourName || '',
    company: s.company || '',
    role: s.yourRole || ''
  };
}
/** returns { text, missing: [keys], filled: {k:v} } */
function fillVars(text, provided = {}) {
  const auto = autoValues();
  const remembered = Store.s.settings.rememberFill ? Store.s.vars || {} : {};
  const used = {};
  const out = String(text).replace(VAR_RE, (whole, key) => {
    const k = String(key).trim();
    const v = provided[k] != null && provided[k] !== '' ? provided[k]
      : auto[k] != null && auto[k] !== '' ? auto[k]
      : remembered[k] != null && remembered[k] !== '' ? remembered[k]
      : null;
    used[k] = v;
    return v != null ? String(v) : whole;
  });
  const missing = varsIn(text).filter((k) => used[k] == null);
  return { text: out, missing, filled: used };
}

/* DOM helpers that must survive quirky webviews */
function sive(el, opts) {
  try { if (el && typeof el.scrollIntoView === 'function') el.scrollIntoView(opts || { block: 'nearest' }); } catch (e) { /* noop */ }
}
function safeFocus(el, opts) {
  try { if (el) { el.focus(opts); if (el.select && opts && opts.select) el.select(); } } catch (e) { /* noop */ }
}

/* escaping + highlighting */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function hl(text, needle) {
  const t = String(text ?? '');
  if (!needle) return esc(t);
  const i = t.toLowerCase().indexOf(needle.toLowerCase());
  if (i < 0) return esc(t);
  return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + needle.length)) + '</mark>' + esc(t.slice(i + needle.length));
}
function bytes(n) {
  if (!Number.isFinite(n)) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}
function ago(iso) {
  if (!iso) return '';
  const t = new Date(iso).getTime();
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 45) return 'just now';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  if (s < 86400 * 7) return Math.round(s / 86400) + 'd ago';
  return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

   seed.js — starter library for an Online Support Rep
   All wording is generic and yours to edit; nothing is
   company-official. Delete what you won't use.
   ========================================================= */

function seedData() {
  const S = (id, name, color, desc) => ({ id, name, color, desc, order: 0 });

  const cats = [
    S('first-touch', 'First touch', '#2f6df6', 'First reply to a new thread: acknowledge, set an expectation, ask for what you need.'),
    S('triage', 'Troubleshooting', '#0f9d8a', 'Diagnostic questions and the step-by-step fixes you send over and over.'),
    S('access', 'Account & access', '#7b5cd6', 'Login, password, permissions, 2FA, lockouts, security checks.'),
    S('billing', 'Billing', '#d98314', 'Invoices, failed payments, refunds, plan changes.'),
    S('handoff', 'Handoffs & escalations', '#c1362f', 'Warm transfers that give the next team everything and lose nothing.'),
    S('incidents', 'Outages & known issues', '#b0457a', 'Incident ack, status updates, all-clear follow-ups.'),
    S('followup', 'Follow-ups', '#2f6df6', 'Chasers, no-reply nudges, "waiting on the other team" updates.'),
    S('closure', 'Resolutions & closures', '#2f8a3f', 'Fix confirmed, recap, close politely, not-a-bug explanations.'),
    S('tough', 'Tough news', '#c1362f', 'Apologies, de-escalation, declines, delays you have to own.'),
    S('policy', 'Policy & scope', '#4a5b6a', 'Privacy requests, what we do not do, SLA wording.')
  ];

  let i = 0;
  const T = (category, title, tags, body, useWhen, fav) => ({
    id: 'tpl_' + (++i).toString().padStart(2, '0'),
    title, category, tags, body: body.trim(), useWhen: useWhen || '',

  });

  const templates = [
    T('first-touch', 'Acknowledge + set expectation', ['ack', 'default'], `

    'Refund request — declining politely': 'Re: {{invoice_id}} — what I could and could not do',
    'Plan change / downgrade explanation': 'Re: switching to {{new_plan}} — what changes',
    'Warm transfer to a specialist team': 'Re: {{ticket_id}} — passed to {{team}} (I am still on it)',
    'Escalate to L2 with a case summary': 'ESC {{severity}}: {{ticket_id}} — {{one_line_problem}}',
    'Out of scope → point to the right channel': 'Re: {{ticket_id}} — who actually handles {{topic}}',
    'Known outage — acknowledgement': 'Known issue: {{symptom}} (we are on it)',
    'Incident resolved — follow-up': 'Resolved: {{symptom}}',
    'Nudge after no reply (1st)': 'Re: {{ticket_id}} — still needing you?',
    'Closing for inactivity (2nd nudge)': 'Closing {{ticket_id}} in {{days}} days unless you need more',
    'Waiting on another team': 'Re: {{ticket_id}} — status while I wait on {{team}}',
    'Fix confirmed + wrap-up': 'Re: {{ticket_id}} — fixed, here is the recap',
    'Not a bug — expected behaviour': 'Re: {{ticket_id}} — why {{feature}} works this way',
    'Genuine apology + make-good': 'Re: {{ticket_id}} — sorry, and what I have done about it',
    'De-escalate an angry client': 'Re: {{ticket_id}} — I am taking this over personally',
    'Data / privacy request': 'Your data request — what happens next',
    'Unsupported request / can\'t do it': 'Re: {{ticket_id}} — honest answer on {{request}}',
    'SLA / timeline expectation set': 'Re: {{ticket_id}} — what to expect and when'
  };
  templates.forEach((t) => { t.subject = SUBJECTS[t.title] || ''; });

  cats.forEach((c, n) => { c.order = n; });
  return { cats, templates, phrases };
}
